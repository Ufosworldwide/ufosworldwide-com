<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILDTRACK — Global Animal Tracking</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0b1218;
  --panel-bg: rgba(11,18,24,0.96);
  --border: rgba(255,255,255,0.08);
  --text: #d4e8f0;
  --muted: #526878;
  --header-h: 52px;
  --panel-w: 300px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:#0b1218; }

/* ── HEADER ── */
#hdr {
  position:fixed; top:0; left:0; right:0; height:var(--header-h);
  background:var(--panel-bg);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:24px; padding:0 20px;
  z-index:1000; backdrop-filter:blur(12px);
}
#logo {
  font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:5px;
  color:#fff; white-space:nowrap;
}
#logo em { color:#3ecf8e; font-style:normal; }
.hdr-stat { font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); line-height:1.6; }
.hdr-stat b { color:#3ecf8e; font-size:13px; display:block; }
#live-pill {
  margin-left:auto; display:flex; align-items:center; gap:7px;
  font-family:'Space Mono',monospace; font-size:9px; color:#3ecf8e; letter-spacing:1px;
  border:1px solid rgba(62,207,142,0.3); border-radius:20px; padding:4px 12px;
}
#live-dot { width:6px; height:6px; border-radius:50%; background:#3ecf8e;
  box-shadow:0 0 6px #3ecf8e; animation:blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── MAP ── */
#map {
  position:fixed; top:var(--header-h); left:var(--panel-w); right:0; bottom:72px;
  z-index:1;
}

/* ── LEFT PANEL ── */
#panel {
  position:fixed; top:var(--header-h); left:0; bottom:72px;
  width:var(--panel-w);
  background:var(--panel-bg);
  border-right:1px solid var(--border);
  z-index:500; overflow:hidden;
  display:flex; flex-direction:column;
}
#panel-top {
  padding:14px 16px 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#panel-title { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:3px; color:var(--muted); margin-bottom:10px; }
#search-box {
  width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border);
  border-radius:6px; padding:7px 11px; color:var(--text); font-family:'Outfit',sans-serif;
  font-size:12px; outline:none;
}
#search-box::placeholder { color:var(--muted); }
#search-box:focus { border-color:rgba(62,207,142,0.4); }

#species-scroll { overflow-y:auto; flex:1; padding:8px 0; }
#species-scroll::-webkit-scrollbar { width:3px; }
#species-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* ── SPECIES BLOCK ── */
.sp-block { border-bottom:1px solid var(--border); }

.sp-header {
  display:flex; align-items:center; gap:10px;
  padding:11px 16px; cursor:pointer;
  transition:background 0.15s;
  user-select:none;
}
.sp-header:hover { background:rgba(255,255,255,0.03); }
.sp-header.all-on { }

.sp-swatch { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.sp-emoji { font-size:18px; line-height:1; }
.sp-label { flex:1; }
.sp-name { font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; color:var(--text); }
.sp-sci { font-family:'Space Mono',monospace; font-size:8px; color:var(--muted); font-style:italic; }
.sp-count { font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); }
.sp-toggle {
  width:22px; height:22px; border-radius:4px; border:1px solid var(--border);
  background:none; color:var(--muted); cursor:pointer; font-size:10px;
  display:flex; align-items:center; justify-content:center; transition:all 0.15s;
  flex-shrink:0;
}
.sp-toggle.on { background:rgba(62,207,142,0.15); border-color:rgba(62,207,142,0.4); color:#3ecf8e; }
.sp-chevron { font-size:10px; color:var(--muted); transition:transform 0.2s; flex-shrink:0; }
.sp-chevron.open { transform:rotate(90deg); }

/* ── INDIVIDUAL ANIMALS ── */
.animals-list { display:none; padding:0 0 6px 0; }
.animals-list.open { display:block; }

.all-row {
  display:flex; align-items:center; gap:8px;
  padding:5px 16px 5px 38px; cursor:pointer;
  font-family:'Space Mono',monospace; font-size:9px; color:var(--muted);
  transition:color 0.15s;
}
.all-row:hover { color:var(--text); }

.animal-row {
  display:flex; align-items:center; gap:8px;
  padding:6px 16px 6px 38px; cursor:pointer;
  transition:background 0.15s; border-radius:0;
}
.animal-row:hover { background:rgba(255,255,255,0.03); }
.animal-row.selected { background:rgba(255,255,255,0.05); }

.ani-color { width:8px; height:8px; border-radius:50%; flex-shrink:0; box-shadow:0 0 5px currentColor; }
.ani-name { font-family:'Outfit',sans-serif; font-size:12px; font-weight:500; color:var(--text); flex:1; }
.ani-id { font-family:'Space Mono',monospace; font-size:8px; color:var(--muted); }
.ani-check {
  width:16px; height:16px; border-radius:3px; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; transition:all 0.15s; flex-shrink:0; color:transparent;
}
.animal-row.selected .ani-check { border-color:currentColor; color:var(--text); background:rgba(255,255,255,0.1); }

/* ── CROSSINGS BADGE ── */
#crossings-bar {
  position:fixed; top:calc(var(--header-h) + 12px); left:calc(var(--panel-w) + 12px);
  z-index:800; display:none;
  background:rgba(11,18,24,0.92); border:1px solid rgba(255,180,0,0.5);
  border-radius:8px; padding:8px 14px;
  font-family:'Space Mono',monospace; font-size:10px; color:#ffb400;
  backdrop-filter:blur(8px);
  box-shadow:0 0 20px rgba(255,180,0,0.15);
}
#crossings-bar b { font-size:18px; display:inline-block; margin-right:6px; }

/* ── DETAIL POPUP (custom, not leaflet) ── */
#detail-card {
  position:fixed; right:16px; top:calc(var(--header-h) + 16px);
  width:260px; background:var(--panel-bg); border:1px solid var(--border);
  border-radius:10px; padding:18px; z-index:900;
  transform:translateX(300px); transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);
  backdrop-filter:blur(12px);
}
#detail-card.open { transform:translateX(0); }
#dc-close {
  position:absolute; top:12px; right:12px; background:none;
  border:1px solid var(--border); color:var(--muted); width:24px; height:24px;
  border-radius:4px; cursor:pointer; font-size:11px; display:flex;
  align-items:center; justify-content:center; transition:all 0.15s;
}
#dc-close:hover { border-color:#fff; color:#fff; }
#dc-emoji { font-size:36px; display:block; margin-bottom:8px; }
#dc-name { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; margin-bottom:2px; }
#dc-id { font-family:'Space Mono',monospace; font-size:8px; color:var(--muted); margin-bottom:14px; }
.dc-row { padding:8px 0; border-bottom:1px solid var(--border); }
.dc-label { font-family:'Space Mono',monospace; font-size:8px; letter-spacing:2px; color:var(--muted); margin-bottom:3px; }
.dc-val { font-family:'Outfit',sans-serif; font-size:13px; color:var(--text); font-weight:500; }
.dc-val.big { font-family:'Space Mono',monospace; font-size:20px; }

/* ── TIMELINE ── */
#timeline {
  position:fixed; bottom:0; left:var(--panel-w); right:0; height:72px;
  background:var(--panel-bg); border-top:1px solid var(--border);
  z-index:1000; display:flex; align-items:center; gap:16px; padding:0 24px;
  backdrop-filter:blur(8px);
}
#tl-label { font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); white-space:nowrap; letter-spacing:1px; }
#play-btn {
  width:34px; height:34px; border-radius:6px; border:1px solid var(--border);
  background:none; color:var(--text); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all 0.15s;
  flex-shrink:0;
}
#play-btn:hover { border-color:#3ecf8e; color:#3ecf8e; box-shadow:0 0 10px rgba(62,207,142,0.2); }
#tl-slider {
  flex:1; -webkit-appearance:none; appearance:none;
  height:2px; background:var(--border); border-radius:1px; outline:none; cursor:pointer;
}
#tl-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:#3ecf8e; box-shadow:0 0 10px rgba(62,207,142,0.6); cursor:pointer;
}
#tl-date {
  font-family:'Space Mono',monospace; font-size:12px; color:#3ecf8e;
  white-space:nowrap; min-width:90px; text-align:right;
}
#tl-speed {
  font-family:'Space Mono',monospace; font-size:9px; color:var(--muted);
  background:none; border:1px solid var(--border); border-radius:4px;
  padding:4px 8px; cursor:pointer; color:var(--muted); transition:all 0.15s;
  white-space:nowrap;
}
#tl-speed:hover { border-color:var(--muted); color:var(--text); }

/* ── LEAFLET OVERRIDES ── */
.leaflet-container { background:#1a3a5c !important; }
.crossing-marker {
  background:rgba(255,180,0,0.9); border:2px solid #fff;
  border-radius:50%; width:14px; height:14px;
  box-shadow:0 0 12px rgba(255,180,0,0.8);
  animation:cross-pulse 1.5s ease-in-out infinite;
}
@keyframes cross-pulse {
  0%,100%{ box-shadow:0 0 12px rgba(255,180,0,0.8); transform:scale(1); }
  50%{ box-shadow:0 0 24px rgba(255,180,0,0.4); transform:scale(1.3); }
}
.leaflet-popup-content-wrapper {
  background:rgba(11,18,24,0.95) !important;
  border:1px solid rgba(255,255,255,0.1) !important;
  border-radius:8px !important;
  color:#d4e8f0 !important;
  font-family:'Outfit',sans-serif !important;
  box-shadow:0 8px 32px rgba(0,0,0,0.5) !important;
  backdrop-filter:blur(8px);
}
.leaflet-popup-tip { background:rgba(11,18,24,0.95) !important; }
.leaflet-popup-content { font-family:'Outfit',sans-serif !important; font-size:13px !important; color:#d4e8f0 !important; }
.leaflet-control-zoom a { background:rgba(11,18,24,0.9) !important; color:#d4e8f0 !important; border-color:rgba(255,255,255,0.1) !important; }
.leaflet-control-zoom a:hover { background:rgba(62,207,142,0.2) !important; color:#3ecf8e !important; }

/* ── LOADING ── */
#loader {
  position:fixed; inset:0; background:#0b1218;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; z-index:9999; transition:opacity 0.6s;
}
#loader.gone { opacity:0; pointer-events:none; }
#loader-logo { font-family:'Bebas Neue',sans-serif; font-size:72px; letter-spacing:8px; color:#3ecf8e;
  text-shadow:0 0 40px rgba(62,207,142,0.5); animation:logopulse 2s ease-in-out infinite; }
@keyframes logopulse { 0%,100%{text-shadow:0 0 40px rgba(62,207,142,0.4)} 50%{text-shadow:0 0 80px rgba(62,207,142,0.9)} }
#loader-sub { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:4px; color:#526878; }
#loader-bar-wrap { width:200px; height:1px; background:rgba(255,255,255,0.08); overflow:hidden; }
#loader-bar { height:100%; background:#3ecf8e; box-shadow:0 0 8px #3ecf8e; width:0; transition:width 0.08s linear; }
</style>
</head>

<!-- LOADER -->
<div id="loader">
  <div id="loader-logo">WILDTRACK</div>
  <div id="loader-sub">GLOBAL ANIMAL INTELLIGENCE</div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<!-- HEADER -->
<div id="hdr">

<div id="panel">

<!-- MAP -->
<div id="map"></div>

<!-- CROSSINGS INDICATOR -->
<div id="crossings-bar"></div>

</div>

<!-- TIMELINE -->
<div id="timeline">
  <div id="tl-label">TIMELINE</div>
  <button id="play-btn">▶</button>
  <input id="tl-slider" type="range" min="0" max="100" value="100">
  <div id="tl-date">2024</div>
  <button id="tl-speed">1×</button>
</div>

// Generate individual colors within species family
function shadeColor(hex, factor) {
  // shift hue slightly for each animal in species
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const nr = Math.min(255, Math.max(0, r + factor * 40));
  const ng = Math.min(255, Math.max(0, g + factor * 25));
  const nb = Math.min(255, Math.max(0, b + factor * 35));
  return `rgb(${Math.round(nr)},${Math.round(ng)},${Math.round(nb)})`;
}

SPECIES.forEach(sp => {
  sp.individuals.forEach((ani, i) => {
    const factors = [-1.5,-0.8,-0.2,0.4,1.0,1.6,2.2];
    ani.color = shadeColor(sp.baseColor, factors[i] || 0);
    ani.spId = sp.id;
    ani.spEmoji = sp.emoji;
    ani.selected = false;
  });
});

function init() {
  let pct = 0;
  const bar = document.getElementById('loader-bar');
  const iv = setInterval(() => {
    pct += Math.random() * 18;
    if (pct >= 100) { pct = 100; bar.style.width = '100%'; clearInterval(iv);
      setTimeout(startApp, 400); }
    else bar.style.width = pct + '%';
  }, 100);
}

function startApp() {
  document.getElementById('loader').classList.add('gone');
  initMap();
  buildPanel();
  updateHeader();
  // Select all by default
  SPECIES.forEach(sp => sp.individuals.forEach(a => { a.selected = true; }));
  renderAll();
  updateHeader();
  setupTimeline();
}

// ═══════════════════════════════════════
// MAP
// ═══════════════════════════════════════
function initMap() {
  map = L.map('map', {
    center: [20, 0], zoom: 2,
    minZoom: 1, maxZoom: 8,
    worldCopyJump: true,
    zoomControl: true,
  });

  // Satellite/terrain tiles from Esri — real blue ocean + green land
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 8
  }).addTo(map);
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function renderAll() {
  // Clear existing
  Object.values(layerMap).forEach(layers => {
    Object.values(layers).forEach(l => { if (l && map.hasLayer(l)) map.removeLayer(l); });
  });
  Object.keys(layerMap).forEach(k => delete layerMap[k]);
  clearCrossingMarkers();

  const selected = getAllSelected();
  selected.forEach(ani => renderAnimal(ani));

  if (selected.length >= 2) detectCrossings(selected);
  updateHeader();
}

function renderAnimal(ani) {
  const pts = getVisibleTrack(ani.track);
  if (pts.length < 2) return;

  const latLngs = pts.map(([lng, lat]) => [lat, lng]);

  // Trail
  const trail = L.polyline(latLngs, {
    color: ani.color,
    weight: 2.5,
    opacity: 0.75,
    smoothFactor: 1.5,
    dashArray: null,
  }).addTo(map);

  // Endpoint dot
  const lastPt = latLngs[latLngs.length - 1];
  const sp = SPECIES.find(s => s.id === ani.spId);

  const dotIcon = L.divIcon({
    className: '',
    html: `<div style="
      width:12px;height:12px;border-radius:50%;
      background:${ani.color};
      border:2px solid rgba(255,255,255,0.8);
      box-shadow:0 0 10px ${ani.color}, 0 0 20px ${ani.color}55;
      cursor:pointer;
    "></div>`,
    iconSize: [12, 12],
    iconAnchor: [6, 6],
  });

  const dot = L.marker(lastPt, { icon: dotIcon, zIndexOffset: 100 })
    .addTo(map)
    .on('click', () => openDetail(ani, sp))
    .on('mouseover', (e) => {
      L.popup({ closeButton:false, offset:[0,-6] })
        .setLatLng(e.latlng)
        .setContent(`<b style="color:${ani.color}">${ani.name}</b><br><span style="opacity:0.6;font-size:11px">${sp.emoji} ${sp.name} · ${ani.id}</span>`)
        .openOn(map);
    })
    .on('mouseout', () => map.closePopup());

  layerMap[ani.id] = { trail, dot };
}

function getVisibleTrack(track) {
  const count = Math.max(2, Math.round(track.length * tlValue / 100));
  return track.slice(0, count);
}

// ═══════════════════════════════════════
// CROSSING DETECTION
// ═══════════════════════════════════════
function detectCrossings(animals) {
  clearCrossingMarkers();
  const crossings = [];
  const THRESHOLD = 3.5; // degrees (~350km)

  for (let i = 0; i < animals.length; i++) {
    for (let j = i + 1; j < animals.length; j++) {
      const a = animals[i], b = animals[j];
      const aTrack = getVisibleTrack(a.track);
      const bTrack = getVisibleTrack(b.track);

      aTrack.forEach(([aLon, aLat]) => {
        bTrack.forEach(([bLon, bLat]) => {
          const dist = Math.sqrt(Math.pow(aLon - bLon, 2) + Math.pow(aLat - bLat, 2));
          if (dist < THRESHOLD) {
            const midLat = (aLat + bLat) / 2;
            const midLon = (aLon + bLon) / 2;
            // Dedupe
            const tooClose = crossings.some(c => Math.abs(c[0] - midLat) < 2 && Math.abs(c[1] - midLon) < 2);
            if (!tooClose) {
              crossings.push([midLat, midLon, a, b]);
            }
          }
        });
      });
    }
  }

  crossings.forEach(([lat, lon, a, b]) => {
    const icon = L.divIcon({
      className: 'crossing-marker',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });
    const marker = L.marker([lat, lon], { icon, zIndexOffset: 500 })
      .addTo(map)
      .on('click', () => {
        L.popup()
          .setLatLng([lat, lon])
          .setContent(`
            <div style="line-height:1.7">
              <b style="color:#ffb400;font-size:12px">⚡ PATH CROSSING DETECTED</b><br>
              <span style="color:${a.color}">● ${a.name}</span> (${a.id})<br>
              <span style="color:${b.color}">● ${b.name}</span> (${b.id})<br>
              <span style="opacity:0.5;font-size:10px">${lat.toFixed(2)}°, ${lon.toFixed(2)}°</span>
            </div>
          `)
          .openOn(map);
      });
    crossingMarkers.push(marker);
  });

  // Update crossings bar
  const bar = document.getElementById('crossings-bar');
  if (crossings.length > 0) {
    bar.style.display = 'block';
    bar.innerHTML = `<b>${crossings.length}</b> PATH CROSSING${crossings.length > 1 ? 'S' : ''} DETECTED — click <span style="color:#ffb400">●</span> on map`;
  } else {
    bar.style.display = 'none';
  }
  document.getElementById('h-crossings').textContent = crossings.length;
}

function clearCrossingMarkers() {
  crossingMarkers.forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
  crossingMarkers.length = 0;
  document.getElementById('crossings-bar').style.display = 'none';
  document.getElementById('h-crossings').textContent = 0;
}

// PANEL
// ═══════════════════════════════════════
function buildPanel() {
  const scroll = document.getElementById('species-scroll');
  scroll.innerHTML = '';

  SPECIES.forEach(sp => {
    const block = document.createElement('div');
    block.className = 'sp-block';
    block.id = `sp-block-${sp.id}`;

    const hdr = document.createElement('div');
    hdr.className = 'sp-header';
    hdr.innerHTML = `
      <div class="sp-swatch" style="background:${sp.baseColor};box-shadow:0 0 6px ${sp.baseColor}"></div>
      <span class="sp-emoji">${sp.emoji}</span>
      <div class="sp-label">
        <div class="sp-name">${sp.name}</div>
        <div class="sp-sci">${sp.scientific}</div>
      </div>
      <div class="sp-count">${sp.individuals.length} tracked</div>
      <button class="sp-toggle on" id="sptog-${sp.id}" title="Toggle all">✓</button>
      <span class="sp-chevron" id="chev-${sp.id}">›</span>
    `;

    const list = document.createElement('div');
    list.className = 'animals-list';
    list.id = `anlist-${sp.id}`;

    // "Select All / None" row
    const allRow = document.createElement('div');
    allRow.className = 'all-row';
    allRow.innerHTML = `<span>SELECT: </span><span style="color:var(--text);margin-left:4px;text-decoration:underline" id="sel-all-${sp.id}">ALL</span><span style="margin:0 4px">/</span><span style="color:var(--text);text-decoration:underline" id="sel-none-${sp.id}">NONE</span>`;
    list.appendChild(allRow);

    document.getElementById(`sel-all-${sp.id}`) && null; // will bind after append

    sp.individuals.forEach(ani => {
      const row = document.createElement('div');
      row.className = 'animal-row selected';
      row.id = `anirow-${ani.id}`;
      row.innerHTML = `
        <div class="ani-color" style="background:${ani.color};color:${ani.color};box-shadow:0 0 5px ${ani.color}"></div>
        <div class="ani-name">${ani.name}</div>
        <div class="ani-id">${ani.id}</div>
        <div class="ani-check">✓</div>
      `;
      row.addEventListener('click', () => toggleAnimal(ani, row));
      list.appendChild(row);
    });

    block.appendChild(hdr);
    block.appendChild(list);
    scroll.appendChild(block);

    // Chevron expand/collapse
    hdr.addEventListener('click', (e) => {
      if (e.target.closest('.sp-toggle')) return;
      const listEl = document.getElementById(`anlist-${sp.id}`);
      const chev = document.getElementById(`chev-${sp.id}`);
      listEl.classList.toggle('open');
      chev.classList.toggle('open');
    });

    // Species master toggle
    document.getElementById(`sptog-${sp.id}`).addEventListener('click', (e) => {
      e.stopPropagation();
      const allOn = sp.individuals.every(a => a.selected);
      sp.individuals.forEach(a => {
        a.selected = !allOn;
        const row = document.getElementById(`anirow-${a.id}`);
        if (row) row.classList.toggle('selected', a.selected);
      });
      const tog = document.getElementById(`sptog-${sp.id}`);
      tog.classList.toggle('on', !allOn);
      tog.textContent = !allOn ? '✓' : '○';
      renderAll();
    });

    // Bind select all/none after DOM exists
    setTimeout(() => {
      const sa = document.getElementById(`sel-all-${sp.id}`);
      const sn = document.getElementById(`sel-none-${sp.id}`);
      if (sa) sa.addEventListener('click', (e) => { e.stopPropagation(); sp.individuals.forEach(a => { a.selected = true; const r = document.getElementById(`anirow-${a.id}`); if(r) r.classList.add('selected'); }); renderAll(); });
      if (sn) sn.addEventListener('click', (e) => { e.stopPropagation(); sp.individuals.forEach(a => { a.selected = false; const r = document.getElementById(`anirow-${a.id}`); if(r) r.classList.remove('selected'); }); renderAll(); });
    }, 0);
  });

  // Search
  document.getElementById('search-box').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    SPECIES.forEach(sp => {
      sp.individuals.forEach(ani => {
        const row = document.getElementById(`anirow-${ani.id}`);
        if (!row) return;
        const match = ani.name.toLowerCase().includes(q) || ani.id.toLowerCase().includes(q) || sp.name.toLowerCase().includes(q);
        row.style.display = match || !q ? '' : 'none';
      });
      // Auto-expand if search matches
      if (q) {
        const hasMatch = sp.individuals.some(a => a.name.toLowerCase().includes(q) || sp.name.toLowerCase().includes(q));
        if (hasMatch) {
          document.getElementById(`anlist-${sp.id}`).classList.add('open');
          document.getElementById(`chev-${sp.id}`).classList.add('open');
        }
      }
    });
  });
}

function toggleAnimal(ani, row) {
  ani.selected = !ani.selected;
  row.classList.toggle('selected', ani.selected);
  // Update species master toggle state
  const sp = SPECIES.find(s => s.id === ani.spId);
  const tog = document.getElementById(`sptog-${sp.id}`);
  const allOn = sp.individuals.every(a => a.selected);
  tog.classList.toggle('on', allOn);
  tog.textContent = allOn ? '✓' : '○';
  renderAll();
}

function getAllSelected() {
  return SPECIES.flatMap(sp => sp.individuals.filter(a => a.selected));
}

// ═══════════════════════════════════════
// TIMELINE
// ═══════════════════════════════════════
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function setupTimeline() {
  const slider = document.getElementById('tl-slider');
  const dateEl = document.getElementById('tl-date');
  const playBtn = document.getElementById('play-btn');
  const speedBtn = document.getElementById('tl-speed');
  const speeds = [1,2,4];
  let speedIdx = 0;

  function updateDate(v) {
    const totalMonths = 72; // 6 years
    const m = Math.floor(v / 100 * totalMonths);
    const year = 2018 + Math.floor(m / 12);
    const month = m % 12;
    dateEl.textContent = `${MONTHS[month]} ${year}`;
  }

  slider.addEventListener('input', () => {
    tlValue = parseInt(slider.value);
    updateDate(tlValue);
    renderAll();
  });

  playBtn.addEventListener('click', () => {
    if (isPlaying) {
      isPlaying = false; playBtn.textContent = '▶'; clearInterval(playIv);
    } else {
      isPlaying = true; playBtn.textContent = '⏸';
      if (tlValue >= 100) { slider.value = 0; tlValue = 0; }
      playIv = setInterval(() => {
        tlValue = Math.min(100, tlValue + 0.4 * playSpeed);
        slider.value = tlValue;
        updateDate(tlValue);
        renderAll();
        if (tlValue >= 100) { isPlaying = false; playBtn.textContent = '▶'; clearInterval(playIv); }
      }, 50);
    }
  });

  speedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    playSpeed = speeds[speedIdx];
    speedBtn.textContent = `${playSpeed}×`;
  });

  updateDate(100);
}

init();
</script>
</body>
</html>
