<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block World Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #ffd700;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }
        #ui span {
            margin-right: 20px;
        }
        #startScreen, #gameOverScreen, #winScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            color: #fff;
        }
        #startScreen h1, #gameOverScreen h1, #winScreen h1 {
            font-size: 48px;
            color: #ffd700;
            text-shadow: 3px 3px 0 #ff6b35, 6px 6px 0 #000;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(180deg, #ff6b35 0%, #e55a2b 100%);
            border: 3px solid #ffd700;
            color: #fff;
            cursor: pointer;
            margin: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            transition: transform 0.1s;
        }
        .btn:hover {
            transform: scale(1.1);
            background: linear-gradient(180deg, #ff8555 0%, #ff6b35 100%);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .controls-info {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
        .controls-info span {
            color: #ffd700;
            font-weight: bold;
        }
        #lives {
            color: #ff4444;
        }
        #coins {
            color: #ffd700;
        }
        .hidden {
            display: none !important;
        }
        .enemy-sprite {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
        <div id="ui">
            <span id="score">SCORE: 000000</span>
            <span id="coins">COINS: 00</span>
            <span id="lives">LIVES: 3</span>
            <span id="world">WORLD: 1-1</span>
        </div>
        <div id="startScreen">
            <h1>BLOCK WORLD</h1>
            <p style="font-size: 20px; margin-bottom: 30px; color: #aaa;">A Pixel Adventure</p>
            <button class="btn" onclick="startGame()">START GAME</button>
            <div class="controls-info">
                <p><span>ARROW KEYS</span> to Move</p>
                <p><span>SPACEBAR</span> to Jump</p>
                <p>Jump on enemies to defeat them!</p>
                <p>Reach the flag to win!</p>
            </div>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>GAME OVER</h1>
            <p id="finalScore" style="font-size: 24px; margin-bottom: 20px;">Score: 0</p>
            <button class="btn" onclick="restartGame()">TRY AGAIN</button>
        </div>
        <div id="winScreen" class="hidden">
            <h1>YOU WIN!</h1>
            <p id="winScore" style="font-size: 24px; margin-bottom: 20px;">Score: 0</p>
            <p style="font-size: 18px; color: #ffd700; margin-bottom: 20px;">The Block World is saved!</p>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game state
let gameRunning = false;
let score = 0;
let coins = 0;
let lives = 3;
let camera = { x: 0, y: 0 };
let frameCount = 0;

// Input handling
const keys = {};
document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
        e.preventDefault();
    }
});
document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

// Block types (Minecraft-inspired)
const BLOCK = {
    GRASS: 1,
    DIRT: 2,
    STONE: 3,
    BRICK: 4,
    QUESTION: 5,
    PIPE_TOP: 6,
    PIPE_BODY: 7,
    COIN: 8,
    FLAG_POLE: 9,
    FLAG_TOP: 10,
    EMPTY: 0
};

// Pixel art patterns for blocks
function drawBlockPattern(type, x, y, size) {
    ctx.save();
    ctx.translate(x, y);

    switch(type) {
        case BLOCK.GRASS:
            // Grass block top
            ctx.fillStyle = '#4a7c2a';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#5d9e3a';
            ctx.fillRect(2, 2, size-4, size/2-2);
            ctx.fillStyle = '#3d6b1f';
            ctx.fillRect(0, size/2, size, size/2);
            // Grass details
            ctx.fillStyle = '#6bb84a';
            ctx.fillRect(4, 4, 6, 4);
            ctx.fillRect(16, 8, 8, 3);
            ctx.fillRect(10, 2, 5, 5);
            ctx.fillStyle = '#2d5016';
            ctx.fillRect(2, size/2+2, size-4, 3);
            break;

        case BLOCK.DIRT:
            ctx.fillStyle = '#8B6914';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#6b4e0a';
            ctx.fillRect(4, 4, 8, 6);
            ctx.fillRect(20, 12, 6, 8);
            ctx.fillRect(10, 22, 10, 4);
            ctx.fillStyle = '#a0781a';
            ctx.fillRect(2, 2, 4, 4);
            ctx.fillRect(18, 6, 5, 5);
            break;

        case BLOCK.STONE:
            ctx.fillStyle = '#7a7a7a';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#8a8a8a';
            ctx.fillRect(2, 2, size-4, size-4);
            ctx.fillStyle = '#6a6a6a';
            ctx.fillRect(6, 6, 8, 6);
            ctx.fillRect(18, 14, 6, 8);
            ctx.fillRect(4, 22, 10, 4);
            ctx.fillStyle = '#5a5a5a';
            ctx.fillRect(2, 2, 4, 4);
            ctx.fillRect(20, 4, 4, 4);
            break;

        case BLOCK.BRICK:
            ctx.fillStyle = '#8B2500';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#A03000';
            ctx.fillRect(2, 2, size-4, size-4);
            // Brick pattern
            ctx.fillStyle = '#6B1A00';
            ctx.fillRect(0, 10, size, 3);
            ctx.fillRect(0, 22, size, 3);
            ctx.fillRect(15, 0, 3, 10);
            ctx.fillRect(7, 13, 3, 9);
            ctx.fillRect(22, 13, 3, 9);
            break;

        case BLOCK.QUESTION:
            // Animated question block
            const glow = Math.sin(frameCount * 0.1) * 0.3 + 0.7;
            ctx.fillStyle = `rgb(${200 * glow}, ${150 * glow}, 0)`;
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = `rgb(${255 * glow}, ${200 * glow}, 50)`;
            ctx.fillRect(2, 2, size-4, size-4);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', size/2, size/2);
            // Corner bolts
            ctx.fillStyle = '#8B6914';
            ctx.fillRect(2, 2, 4, 4);
            ctx.fillRect(size-6, 2, 4, 4);
            ctx.fillRect(2, size-6, 4, 4);
            ctx.fillRect(size-6, size-6, 4, 4);
            break;

        case BLOCK.PIPE_TOP:
            ctx.fillStyle = '#2d8a3e';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#3cb85c';
            ctx.fillRect(2, 2, size-4, size-4);
            ctx.fillStyle = '#1a5c26';
            ctx.fillRect(0, size-6, size, 6);
            ctx.fillStyle = '#4dd46e';
            ctx.fillRect(4, 4, size-8, 4);
            break;

        case BLOCK.PIPE_BODY:
            ctx.fillStyle = '#2d8a3e';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#3cb85c';
            ctx.fillRect(2, 0, size-4, size);
            ctx.fillStyle = '#1a5c26';
            ctx.fillRect(0, 0, 4, size);
            ctx.fillRect(size-4, 0, 4, size);
            break;

        case BLOCK.FLAG_POLE:
            ctx.fillStyle = '#ccc';
            ctx.fillRect(size/2-2, 0, 4, size);
            ctx.fillStyle = '#999';
            ctx.fillRect(size/2-1, 0, 2, size);
            break;

        case BLOCK.FLAG_TOP:
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(size/2, 0);
            ctx.lineTo(size, size/3);
            ctx.lineTo(size/2, size/2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.moveTo(size/2, size/2);
            ctx.lineTo(size, size/3);
            ctx.lineTo(size, size*2/3);
            ctx.lineTo(size/2, size);
            ctx.closePath();
            ctx.fill();
            break;
    }
    ctx.restore();
}

// Level design (0=empty, 1=grass, 2=dirt, 3=stone, 4=brick, 5=question, 6=pipeTop, 7=pipeBody, 9=flagPole, 10=flagTop)
const TILE_SIZE = 32;
const LEVEL_WIDTH = 200;
const LEVEL_HEIGHT = 15;

function generateLevel() {
    const level = [];
    for (let y = 0; y < LEVEL_HEIGHT; y++) {
        level[y] = [];
        for (let x = 0; x < LEVEL_WIDTH; x++) {
            level[y][x] = BLOCK.EMPTY;
        }
    }

    // Ground layer
    for (let x = 0; x < LEVEL_WIDTH; x++) {
        level[LEVEL_HEIGHT-1][x] = BLOCK.GRASS;
        level[LEVEL_HEIGHT-2][x] = BLOCK.DIRT;
        level[LEVEL_HEIGHT-3][x] = BLOCK.DIRT;
    }

    // Some gaps
    for (let x = 45; x < 50; x++) {
        level[LEVEL_HEIGHT-1][x] = BLOCK.EMPTY;
        level[LEVEL_HEIGHT-2][x] = BLOCK.EMPTY;
        level[LEVEL_HEIGHT-3][x] = BLOCK.EMPTY;
    }
    for (let x = 95; x < 100; x++) {
        level[LEVEL_HEIGHT-1][x] = BLOCK.EMPTY;
        level[LEVEL_HEIGHT-2][x] = BLOCK.EMPTY;
        level[LEVEL_HEIGHT-3][x] = BLOCK.EMPTY;
    }
    for (let x = 145; x < 150; x++) {
        level[LEVEL_HEIGHT-1][x] = BLOCK.EMPTY;
        level[LEVEL_HEIGHT-2][x] = BLOCK.EMPTY;
        level[LEVEL_HEIGHT-3][x] = BLOCK.EMPTY;
    }

    // Brick platforms
    function addPlatform(x, y, width) {
        for (let i = 0; i < width; i++) {
            if (y < LEVEL_HEIGHT) level[y][x+i] = BLOCK.BRICK;
        }
    }

    function addQuestion(x, y) {
        if (y < LEVEL_HEIGHT) level[y][x] = BLOCK.QUESTION;
    }

    // Section 1 platforms
    addPlatform(10, 10, 5);
    addQuestion(12, 10);
    addPlatform(18, 8, 3);
    addQuestion(19, 8);
    addPlatform(25, 10, 4);

    // Section 2
    addPlatform(55, 9, 6);
    addQuestion(57, 9);
    addQuestion(58, 9);
    addPlatform(65, 7, 4);
    addPlatform(72, 10, 5);
    addQuestion(74, 10);

    // Section 3
    addPlatform(105, 9, 5);
    addQuestion(107, 9);
    addPlatform(112, 7, 4);
    addPlatform(120, 10, 6);
    addQuestion(122, 10);
    addQuestion(123, 10);

    // Section 4 - Boss area
    addPlatform(155, 10, 8);
    addPlatform(165, 8, 10);
    addPlatform(175, 10, 8);

    // Pipes
    function addPipe(x, y, height) {
        level[y][x] = BLOCK.PIPE_TOP;
        level[y][x+1] = BLOCK.PIPE_TOP;
        for (let h = 1; h < height; h++) {
            level[y+h][x] = BLOCK.PIPE_BODY;
            level[y+h][x+1] = BLOCK.PIPE_BODY;
        }
    }

    addPipe(30, 11, 2);
    addPipe(60, 10, 3);
    addPipe(80, 11, 2);
    addPipe(110, 11, 2);
    addPipe(130, 10, 3);

    // Flag at the end
    level[11][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[10][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[9][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[8][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[7][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[6][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[5][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[4][LEVEL_WIDTH-5] = BLOCK.FLAG_POLE;
    level[3][LEVEL_WIDTH-5] = BLOCK.FLAG_TOP;

    return level;
}

let level = generateLevel();

// Player
const player = {
    x: 100,
    y: 200,
    width: 28,
    height: 28,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpPower: 11,
    gravity: 0.5,
    grounded: false,
    facing: 1,
    invincible: 0,
    animFrame: 0,
    dead: false,
    won: false
};

// Enemies
class Enemy {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.width = 26;
        this.height = 26;
        this.vx = type === 'boss' ? 1.5 : 1;
        this.vy = 0;
        this.type = type; // 'goomba', 'turtle', 'fly', 'boss'
        this.dead = false;
        this.direction = -1;
        this.animFrame = 0;
        this.hp = type === 'boss' ? 10 : 1;
        this.maxHp = type === 'boss' ? 10 : 1;
        this.bossPhase = 0;
        this.bossTimer = 0;
    }

    update() {
        if (this.dead) return;

        this.animFrame++;

        if (this.type === 'boss') {
            this.bossTimer++;
            // Boss movement pattern
            if (this.bossTimer % 180 < 90) {
                this.vx = 1.5 * this.direction;
            } else if (this.bossTimer % 180 < 120) {
                this.vx = 0;
                // Jump attack
                if (this.bossTimer % 180 === 90 && this.grounded) {
                    this.vy = -14;
                }
            } else {
                this.vx = 2.5 * this.direction;
            }

            // Change direction at edges
            if (this.x < 160 * TILE_SIZE || this.x > 190 * TILE_SIZE) {
                this.direction *= -1;
            }
        } else if (this.type === 'fly') {
            this.vy = Math.sin(this.animFrame * 0.05) * 2;
            this.x += this.vx * this.direction;
        } else {
            this.x += this.vx * this.direction;
        }

        // Gravity for non-flying enemies
        if (this.type !== 'fly') {
            this.vy += 0.5;
            this.y += this.vy;
        } else {
            this.y += this.vy;
        }

        // Platform collision
        this.grounded = false;
        const startX = Math.floor(this.x / TILE_SIZE);
        const endX = Math.floor((this.x + this.width) / TILE_SIZE);
        const startY = Math.floor(this.y / TILE_SIZE);
        const endY = Math.floor((this.y + this.height) / TILE_SIZE);

        for (let ty = startY; ty <= endY; ty++) {
            for (let tx = startX; tx <= endX; tx++) {
                if (ty >= 0 && ty < LEVEL_HEIGHT && tx >= 0 && tx < LEVEL_WIDTH) {
                    const block = level[ty][tx];
                    if (block !== BLOCK.EMPTY && block !== BLOCK.COIN && 
                        block !== BLOCK.FLAG_POLE && block !== BLOCK.FLAG_TOP) {
                        // Simple collision resolution
                        if (this.vy > 0 && this.y + this.height > ty * TILE_SIZE && 
                            this.y < ty * TILE_SIZE) {
                            this.y = ty * TILE_SIZE - this.height;
                            this.vy = 0;
                            this.grounded = true;
                        }
                    }
                }
            }
        }

        // Turn around at edges or walls
        if (this.type !== 'boss') {
            const frontX = this.direction > 0 ? 
                Math.floor((this.x + this.width + 2) / TILE_SIZE) :
                Math.floor((this.x - 2) / TILE_SIZE);
            const groundY = Math.floor((this.y + this.height + 2) / TILE_SIZE);

            if (frontX < 0 || frontX >= LEVEL_WIDTH || 
                (groundY < LEVEL_HEIGHT && level[groundY][frontX] === BLOCK.EMPTY)) {
                this.direction *= -1;
            }
        }
    }

    draw() {
        if (this.dead) return;

        const screenX = this.x - camera.x;
        const screenY = this.y - camera.y;

        if (screenX < -50 || screenX > canvas.width + 50) return;

        ctx.save();
        ctx.translate(screenX, screenY);

        if (this.type === 'goomba') {
            // Goomba - brown mushroom-like
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(2, 8, 22, 18);
            ctx.fillStyle = '#A0522D';
            ctx.fillRect(4, 10, 18, 14);
            // Feet
            ctx.fillStyle = '#000';
            ctx.fillRect(2, 24, 6, 4);
            ctx.fillRect(16, 24, 6, 4);
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(6, 12, 5, 6);
            ctx.fillRect(15, 12, 5, 6);
            ctx.fillStyle = '#000';
            ctx.fillRect(7, 14, 3, 3);
            ctx.fillRect(16, 14, 3, 3);
            // Eyebrows
            ctx.fillStyle = '#000';
            ctx.fillRect(5, 10, 7, 2);
            ctx.fillRect(14, 10, 7, 2);
            // Walk animation
            if (this.animFrame % 20 < 10) {
                ctx.fillRect(0, 22, 4, 6);
                ctx.fillRect(22, 22, 4, 6);
            }
        } else if (this.type === 'turtle') {
            // Turtle - green shell
            ctx.fillStyle = '#228B22';
            ctx.fillRect(4, 6, 18, 16);
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(6, 8, 14, 12);
            // Shell pattern
            ctx.fillStyle = '#006400';
            ctx.fillRect(8, 10, 4, 4);
            ctx.fillRect(16, 10, 4, 4);
            ctx.fillRect(12, 16, 4, 4);
            // Head
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(this.direction > 0 ? 20 : 0, 10, 6, 8);
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.direction > 0 ? 22 : 2, 12, 3, 3);
            ctx.fillStyle = '#000';
            ctx.fillRect(this.direction > 0 ? 23 : 3, 13, 2, 2);
            // Legs
            ctx.fillStyle = '#228B22';
            if (this.animFrame % 20 < 10) {
                ctx.fillRect(4, 22, 5, 4);
                ctx.fillRect(17, 22, 5, 4);
            } else {
                ctx.fillRect(2, 22, 5, 4);
                ctx.fillRect(19, 22, 5, 4);
            }
        } else if (this.type === 'fly') {
            // Flying enemy - bat-like
            ctx.fillStyle = '#4B0082';
            ctx.fillRect(8, 8, 10, 14);
            // Wings
            const wingY = Math.sin(this.animFrame * 0.2) * 8;
            ctx.fillStyle = '#663399';
            ctx.beginPath();
            ctx.moveTo(8, 10);
            ctx.lineTo(0, 4 + wingY);
            ctx.lineTo(8, 14);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(18, 10);
            ctx.lineTo(26, 4 + wingY);
            ctx.lineTo(18, 14);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(10, 10, 3, 3);
            ctx.fillRect(15, 10, 3, 3);
        } else if (this.type === 'boss') {
            // Boss - Big Bowser-like
            const scale = 2;
            ctx.scale(scale, scale);
            ctx.translate(-this.width/4, -this.height/4);
