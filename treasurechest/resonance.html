<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Golden Resonance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04010a;touch-action:none}
canvas{position:fixed;inset:0;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const PHI = 1.61803398875;
const PI  = Math.PI;

function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

// ── COLOR PALETTES ────────────────────────────────────────
const PALETTES = [
  // 0 cyan
  {a:'0,240,255', b:'0,180,255', tunnel:'0,240,255', spoke:'255,255,255', bg:'2,1,8'},
  // 1 magenta
  {a:'255,0,110', b:'255,80,180', tunnel:'255,0,110', spoke:'255,200,220', bg:'8,0,4'},
  // 2 gold / fibonacci
  {a:'255,179,0', b:'255,220,80', tunnel:'255,179,0', spoke:'255,240,180', bg:'6,3,0'},
  // 3 violet
  {a:'160,80,255', b:'220,120,255', tunnel:'180,80,255', spoke:'220,180,255', bg:'4,0,8'},
  // 4 green
  {a:'0,255,120', b:'80,255,180', tunnel:'0,255,120', spoke:'180,255,220', bg:'0,6,2'},
  // 5 white fire
  {a:'255,255,255', b:'255,200,120', tunnel:'255,240,180', spoke:'255,255,255', bg:'5,4,2'},
];
let palette = 0;
let P = PALETTES[palette];

// ── PARTICLES ────────────────────────────────────────────
const N = 2400;
const particles = [];

function spiralPoint(i, drift){
  const angle = i*(PI*(3-Math.sqrt(5))) + drift;
  const radius = Math.pow(PHI, i*0.008)*7;
  return {
    bx: Math.cos(angle)*radius,   // base x (relative to centre)
    by: Math.sin(angle)*radius,
  };
}

function initParticles(){
  particles.length = 0;
  for(let i=0;i<N;i++){
    const b = spiralPoint(i, 0);
    particles.push({
      i,
      bx: b.bx, by: b.by,   // base spiral position
      ox: b.bx, oy: b.by,   // current offset from centre (with physics)
      vx: 0,    vy: 0,       // velocity
      depth: (Math.sin(i*0.01)+1)*0.5,
    });
  }
}
initParticles();

// ── POINTER STATE ─────────────────────────────────────────
const pointers = {}; // id → {x,y,px,py,active}

function ptId(e){ return e.pointerId!==undefined ? e.pointerId : 'mouse'; }

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  pointers[ptId(e)]={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,active:true};
  // Tap → cycle palette
  if(Object.keys(pointers).length===1){
    tapTimer = setTimeout(()=>{
      palette=(palette+1)%PALETTES.length;
      P=PALETTES[palette];
    },120);
  }
},{passive:false});

canvas.addEventListener('pointermove', e=>{
  e.preventDefault();
  const p=pointers[ptId(e)];
  if(!p)return;
  clearTimeout(tapTimer); // moved = not a tap
  p.px=p.x; p.py=p.y;
  p.x=e.clientX; p.y=e.clientY;
  p.moved=true;
},{passive:false});

canvas.addEventListener('pointerup',   e=>{ delete pointers[ptId(e)]; },{passive:true});
canvas.addEventListener('pointerout',  e=>{ delete pointers[ptId(e)]; },{passive:true});
canvas.addEventListener('pointercancel',e=>{ delete pointers[ptId(e)];},{passive:true});

let tapTimer;

// ── PHYSICS ───────────────────────────────────────────────
const FORCE_RADIUS  = 120;  // px around finger
const FORCE_STR     = 18;   // push strength
const SPRING_K      = 0.055; // spring back to base
const DAMPING       = 0.82;  // velocity damping
const MAX_V         = 28;

function applyPhysics(t){
  const cx=canvas.width/2, cy=canvas.height/2;
  const pts = Object.values(pointers);

  particles.forEach(p=>{
    // World position
    const wx = cx + p.ox;
    const wy = cy + p.oy;

    // Spring back toward base spiral position
    const dx = p.bx - p.ox;
    const dy = p.by - p.oy;
    p.vx += dx * SPRING_K;
    p.vy += dy * SPRING_K;

    // Finger force
    pts.forEach(pt=>{
      const fdx = wx - pt.x;
      const fdy = wy - pt.y;
      const dist = Math.sqrt(fdx*fdx + fdy*fdy);
      if(dist < FORCE_RADIUS && dist > 0.5){
        // Repulsion — inverse square with soft falloff
        const falloff = 1 - dist/FORCE_RADIUS;
        const mag = FORCE_STR * falloff * falloff / dist;
        p.vx += fdx * mag;
        p.vy += fdy * mag;
      }
    });

    // Damping
    p.vx *= DAMPING;
    p.vy *= DAMPING;

    // Clamp velocity
    const spd = Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    if(spd>MAX_V){ p.vx=p.vx/spd*MAX_V; p.vy=p.vy/spd*MAX_V; }

    p.ox += p.vx;
    p.oy += p.vy;
  });
}

// ── RENDER ────────────────────────────────────────────────
let t = 0;

function draw(){
  t += 0.008;

  const cx = canvas.width/2, cy = canvas.height/2;
  const pulse = Math.sin(t*3.5);
  const drift = t * 0.2;

  // Soft trail fade
  const [r,g,b] = P.bg.split(',');
  ctx.fillStyle = `rgba(${r},${g},${b},0.10)`;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Update base spiral positions (they drift over time — spirograph effect)
  // and apply physics
  applyPhysics(t);

  // ── TUNNEL RINGS ──────────────────────────────────────
  for(let ring=1;ring<20;ring++){
    const rr = ring*46 + Math.sin(t*2+ring)*12;
    const alpha = 0.04 + Math.sin(t*0.5+ring*0.4)*0.02;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,PI*2);
    ctx.strokeStyle=`rgba(${P.tunnel},${alpha})`;
    ctx.lineWidth=1;ctx.stroke();
    // Rotating node on each ring (from Presignal reference engine)
    ctx.save();ctx.translate(cx,cy);
    ctx.rotate(t*(7.83/ring)*0.06);
    ctx.fillStyle=`rgba(${P.tunnel},0.4)`;
    ctx.fillRect(rr,0,3,3);ctx.restore();
  }

  // ── SPIROGRAPH WEB ────────────────────────────────────
  // Connect every 12th particle to its neighbours — creates the intricate web
  for(let i=0;i<N-12;i+=12){
    const a=particles[i], b=particles[i+12];
    const ax=cx+a.ox, ay=cy+a.oy;
    const bx=cx+b.ox, by=cy+b.oy;
    const spd=Math.sqrt(a.vx*a.vx+a.vy*a.vy);
    const alpha=0.015+Math.min(spd*0.008,0.06)+a.depth*0.025;
    ctx.strokeStyle=`rgba(${P.spoke},${alpha})`;
    ctx.lineWidth=0.6;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  }

  // ── SPOKE LINES from centre ───────────────────────────
  for(let i=0;i<N;i+=24){
    const p=particles[i];
    const px=cx+p.ox, py=cy+p.oy;
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    const alpha=0.015+Math.min(spd*0.006,0.04)+p.depth*0.02;
    ctx.strokeStyle=`rgba(${P.spoke},${alpha})`;
    ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
  }

  // ── PARTICLES ─────────────────────────────────────────
  for(let i=0;i<N;i++){
    const p=particles[i];

    // Update base drift (living spirograph — positions shift slowly)
    const b=spiralPoint(i, drift + Math.sin(t*0.3+i*0.004)*0.4);
    p.bx=b.bx; p.by=b.by;

    const px=cx+p.ox, py=cy+p.oy;
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);

    // Size: bigger when fast (collision energy visible)
    const size = 0.5 + p.depth*2.5 + Math.min(spd*0.18,4);

    // Color: alternate between palette a and b per particle index
    // Speed brightens alpha dramatically
    const baseAlpha = 0.15 + p.depth*0.65 + Math.min(spd*0.04,0.35);
    if(i%3===0){
      ctx.fillStyle=`rgba(${P.a},${baseAlpha})`;
    } else if(i%3===1){
      ctx.fillStyle=`rgba(${P.b},${baseAlpha*0.7})`;
    } else {
      // Blend: excited particles flash toward white
      const exc=Math.min(spd/MAX_V,1);
      ctx.fillStyle=`rgba(255,255,255,${exc*0.5+baseAlpha*0.3})`;
    }

    ctx.beginPath();ctx.arc(px,py,size,0,PI*2);ctx.fill();
  }

  // ── FINGER GLOW ───────────────────────────────────────
  Object.values(pointers).forEach(pt=>{
    const gr=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,FORCE_RADIUS);
    gr.addColorStop(0,  `rgba(${P.a},0.18)`);
    gr.addColorStop(0.4,`rgba(${P.a},0.06)`);
    gr.addColorStop(1,  'transparent');
    ctx.fillStyle=gr;
    ctx.beginPath();ctx.arc(pt.x,pt.y,FORCE_RADIUS,0,PI*2);ctx.fill();
    // Centre dot
    ctx.beginPath();ctx.arc(pt.x,pt.y,5,0,PI*2);
    ctx.fillStyle=`rgba(${P.a},0.9)`;ctx.fill();
  });

  // ── CENTRE CORE ───────────────────────────────────────
  const coreR = 18+Math.sin(t*7.83)*4+Math.abs(pulse)*6;
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*2.5);
  cg.addColorStop(0,  `rgba(${P.a},0.9)`);
  cg.addColorStop(0.4,`rgba(${P.b},0.4)`);
  cg.addColorStop(1,  'transparent');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(cx,cy,coreR*2.5,0,PI*2);ctx.fill();

  requestAnimationFrame(draw);
}

// ── INIT ──────────────────────────────────────────────────
ctx.translate(0.5,0.5);
draw();
</script>
</body>
</html>
