<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Golden Resonance Spiral</title>
<style>
:root {
  --bg: #04010a;
  --gold: #ffb300;
  --cyan: #00f0ff;
  --magenta: #ff006e;
  --white: #f5f5f5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: radial-gradient(circle at center, #0b0818 0%, #020104 100%);
  font-family: monospace;
  color: var(--white);
}

canvas {
  position: fixed;
  inset: 0;
}

.overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
}

.header {
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(0,240,255,0.25);
  padding: 16px;
  backdrop-filter: blur(10px);
}

.title {
  font-size: 34px;
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold);
}

.subtitle {
  margin-top: 6px;
  color: var(--cyan);
  font-size: 12px;
  letter-spacing: 2px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
}

.panel {
  pointer-events: auto;
  width: 420px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,179,0,0.25);
  padding: 16px;
  backdrop-filter: blur(10px);
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: rgba(255,179,0,0.12);
  border: 1px solid var(--gold);
  color: var(--gold);
  cursor: pointer;
  font-family: monospace;
  transition: 0.2s ease;
}

button:hover {
  background: var(--gold);
  color: black;
  box-shadow: 0 0 20px var(--gold);
}

.stats {
  line-height: 1.8;
  color: #d8d8d8;
  font-size: 13px;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="overlay">
  <div class="header">
    <div class="title">GOLDEN RESONANCE SPIRAL</div>
    <div class="subtitle">Fibonacci Drift // Harmonic Geometry // Infinite Perspective Engine</div>
  </div>

  <div class="footer">
    <div class="panel">
      <div class="stats">
        Φ Ratio: <span id="phi"></span><br>
        π Oscillation: <span id="pi"></span><br>
        Harmonic Pulse: <span id="pulse"></span><br>
        Spiral Depth: <span id="depth"></span>
      </div>

      <button onclick="toggleMode()">SHIFT RESONANCE MODE</button>
    </div>

    <div style="font-size:11px;opacity:0.5;">
      PRESIGNAL STYLE VISUAL ENGINE // 2026
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const PHI = 1.61803398875;
const PI = Math.PI;

let t = 0;
let mode = 0;

function toggleMode() {
  mode = (mode + 1) % 3;
}

function spiralPoint(i, drift) {
  const angle = i * (PI * (3 - Math.sqrt(5))) + drift;
  const radius = Math.pow(PHI, i * 0.008) * 7;

  return {
    x: Math.cos(angle) * radius,
    y: Math.sin(angle) * radius
  };
}

function draw() {
  t += 0.008;

  ctx.fillStyle = 'rgba(2,1,4,0.08)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  const pulse = Math.sin(t * 3.5);

  document.getElementById('phi').innerText = (PHI + pulse * 0.002).toFixed(6);
  document.getElementById('pi').innerText = (PI + pulse * 0.003).toFixed(6);
  document.getElementById('pulse').innerText = (7.83 + pulse * 0.2).toFixed(3) + ' Hz';
  document.getElementById('depth').innerText = (Math.abs(pulse) * 100).toFixed(0) + '%';

  for (let i = 0; i < 2400; i++) {
    const drift = t * (0.2 + mode * 0.15);
    const p = spiralPoint(i, drift);

    const wave = Math.sin(i * 0.02 + t * 2);

    let x = cx + p.x * (1 + wave * 0.15);
    let y = cy + p.y * (1 + wave * 0.15);

    const depth = (Math.sin(i * 0.01 + t) + 1) * 0.5;
    const size = 0.5 + depth * 3;

    if (mode === 0) {
      ctx.fillStyle = `rgba(0,240,255,${0.15 + depth * 0.7})`;
    } else if (mode === 1) {
      ctx.fillStyle = `rgba(255,0,110,${0.15 + depth * 0.7})`;
    } else {
      ctx.fillStyle = `rgba(255,179,0,${0.15 + depth * 0.7})`;
    }

    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();

    if (i % 12 === 0) {
      ctx.strokeStyle = `rgba(255,255,255,${0.02 + depth * 0.04})`;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }

  drawTunnel(cx, cy);

  requestAnimationFrame(draw);
}

function drawTunnel(cx, cy) {
  for (let r = 1; r < 16; r++) {
    const radius = r * 50 + Math.sin(t * 2 + r) * 10;

    ctx.strokeStyle = mode === 0
      ? 'rgba(0,240,255,0.05)'
      : mode === 1
      ? 'rgba(255,0,110,0.05)'
      : 'rgba(255,179,0,0.05)';

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

ctx.translate(0.5,0.5);
draw();
</script>

</body>
</html>
