<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Golden Resonance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04010a;touch-action:none}
canvas{position:fixed;inset:0;display:block}
#ripple-canvas{z-index:2;pointer-events:none}
#main-canvas{z-index:1}
</style>
</head>
<body>
<canvas id="main-canvas"></canvas>
<canvas id="ripple-canvas"></canvas>
<script>
'use strict';

const main   = document.getElementById('main-canvas');
const ripple = document.getElementById('ripple-canvas');
const mctx   = main.getContext('2d');
const rctx   = ripple.getContext('2d');

const PHI = 1.61803398875;
const PI  = Math.PI;
const GA  = PI*(3-Math.sqrt(5)); // golden angle

function resize(){
  main.width=ripple.width=innerWidth;
  main.height=ripple.height=innerHeight;
}
resize();
addEventListener('resize',resize);

// ═══════════════════════════════════════════════════
// PALETTES
// ═══════════════════════════════════════════════════
const PALETTES = [
  {name:'VOID CYAN',    a:[0,240,255],   b:[0,160,255],  core:[0,240,255],  bg:[2,1,8]},
  {name:'BLOOD MOON',   a:[255,40,80],   b:[255,120,40], core:[255,80,40],  bg:[8,1,2]},
  {name:'GOLDEN FIELD', a:[255,185,0],   b:[255,230,80], core:[255,210,60], bg:[6,3,0]},
  {name:'DEEP VIOLET',  a:[180,60,255],  b:[240,100,255],core:[200,80,255], bg:[3,0,8]},
  {name:'AURORA',       a:[0,255,140],   b:[0,200,255],  core:[80,255,200], bg:[0,5,3]},
  {name:'SOLAR FLARE',  a:[255,255,255], b:[255,180,60], core:[255,240,160],bg:[5,4,1]},
  {name:'NEBULA ROSE',  a:[255,80,180],  b:[180,80,255], core:[255,120,200],bg:[5,0,5]},
  {name:'DEEP OCEAN',   a:[0,180,255],   b:[0,255,200],  core:[40,220,255], bg:[0,2,6]},
];

let palIdx  = 0;
let P       = PALETTES[palIdx];
let targetP = PALETTES[palIdx];
let lerpT   = 1; // 0→1 palette transition

function lerpColor(a,b,t){
  return[
    Math.round(a[0]+(b[0]-a[0])*t),
    Math.round(a[1]+(b[1]-a[1])*t),
    Math.round(a[2]+(b[2]-a[2])*t),
  ];
}

function rgb(c,a=1){return`rgba(${c[0]},${c[1]},${c[2]},${a})`;}

// Live interpolated colors
let liveA, liveB, liveCore, liveBg;
let fromP = PALETTES[0];

function updateLiveColors(){
  const e=lerpT*lerpT*(3-2*lerpT); // smoothstep
  liveA    = lerpColor(fromP.a,   targetP.a,   e);
  liveB    = lerpColor(fromP.b,   targetP.b,   e);
  liveCore = lerpColor(fromP.core,targetP.core,e);
  liveBg   = lerpColor(fromP.bg,  targetP.bg,  e);
  if(lerpT<1) lerpT=Math.min(1,lerpT+0.04);
}

// ═══════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════
const N=2400;
const parts=[];

function spiralBase(i,drift=0){
  const angle=i*GA+drift;
  const r=Math.pow(PHI,i*0.008)*7;
  return{bx:Math.cos(angle)*r, by:Math.sin(angle)*r};
}

function initParts(){
  parts.length=0;
  for(let i=0;i<N;i++){
    const b=spiralBase(i);
    parts.push({i,bx:b.bx,by:b.by,ox:b.bx,oy:b.by,vx:0,vy:0,
      depth:(Math.sin(i*0.01)+1)*0.5});
  }
}
initParts();

// ═══════════════════════════════════════════════════
// RIPPLE SYSTEM — Fibonacci spiral sonar pulses
// ═══════════════════════════════════════════════════
const ripples=[];

// Each ripple = set of expanding Fibonacci arms
function spawnRipple(x,y,color){
  const arms=13; // Fibonacci number
  ripples.push({
    x,y,
    color:[...color],
    age:0,
    maxAge:2.8,   // seconds
    arms,
    rings:[],
  });
}

// Fibonacci ring radii — each ring at PHI^n × base
function fibRingR(n,age){
  return Math.pow(PHI,n)*28*(age*1.8+0.1);
}

// ═══════════════════════════════════════════════════
// AUDIO — "rock dropped in puddle"
// Water droplet: short transient + reverberating sine decay
// ═══════════════════════════════════════════════════
let AC=null;
function getAC(){
  if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  return AC;
}

function playDrop(x,y,paletteIdx){
  const ac=getAC();if(!ac)return;
  const cx=main.width/2, cy=main.height/2;
  // Pan based on tap position
  const pan=Math.max(-1,Math.min(1,(x-cx)/(main.width/2)));
  const dist=Math.sqrt((x-cx)**2+(y-cy)**2);
  const distFrac=Math.min(1,dist/Math.max(main.width,main.height)*2);

  // Base pitch varies with palette and distance from centre
  const baseFreqs=[220,180,260,150,200,300,170,240];
  const base=baseFreqs[paletteIdx]*(1-distFrac*0.4);

  // Layer 1: sharp transient click (the "plop")
  _playTransient(ac, pan, base);

  // Layer 2: primary water ring tones — Fibonacci harmonic series
  // Each subsequent ring tone is base × PHI^n — golden ratio harmonic ladder
  const fibNums=[1,1,2,3,5,8,13];
  fibNums.forEach((fn,i)=>{
    setTimeout(()=>{
      _playRingTone(ac, pan, base*(1+fn*0.12), i, distFrac);
    }, i*95);
  });

  // Layer 3: deep sub resonance (the "water body")
  _playSubResonance(ac, pan, base*0.25, distFrac);
}

function _playTransient(ac, pan, freq){
  try{
    const o=ac.createOscillator();
    const g=ac.createGain();
    const p=ac.createStereoPanner();
    o.type='sine';
    o.frequency.setValueAtTime(freq*2.2,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*0.4,ac.currentTime+0.08);
    g.gain.setValueAtTime(0.5,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.12);
    p.pan.value=pan*0.5;
    o.connect(g);g.connect(p);p.connect(ac.destination);
    o.start();o.stop(ac.currentTime+0.15);
  }catch(e){}
}

function _playRingTone(ac, pan, freq, ringIdx, distFrac){
  try{
    const o=ac.createOscillator();
    const g=ac.createGain();
    const p=ac.createStereoPanner();
    const filt=ac.createBiquadFilter();
    o.type='sine';
    o.frequency.setValueAtTime(freq,ac.currentTime);
    // Each ring tone wobbles slightly — water surface ripple
    o.frequency.linearRampToValueAtTime(freq*(1-0.015*ringIdx),ac.currentTime+0.3);
    filt.type='bandpass';
    filt.frequency.value=freq*1.5;
    filt.Q.value=4+ringIdx*2;
    const vol=0.28/(ringIdx+1);
    const decay=0.4+ringIdx*0.18+distFrac*0.3;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(vol,ac.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+decay);
    p.pan.value=pan*(0.3+ringIdx*0.1);
    o.connect(filt);filt.connect(g);g.connect(p);p.connect(ac.destination);
    o.start();o.stop(ac.currentTime+decay+0.1);
    // PHI overtone shimmer
    if(ringIdx<4){
      const o2=ac.createOscillator(),g2=ac.createGain();
      o2.type='sine';o2.frequency.value=freq*PHI;
      g2.gain.setValueAtTime(0,ac.currentTime);
      g2.gain.linearRampToValueAtTime(vol*0.2,ac.currentTime+0.03);
      g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+decay*0.7);
      o2.connect(g2);g2.connect(p);p.connect(ac.destination);
      o2.start();o2.stop(ac.currentTime+decay*0.8);
    }
  }catch(e){}
}

function _playSubResonance(ac, pan, freq, distFrac){
  try{
    const o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner();
    o.type='sine';o.frequency.value=freq;
    const dur=1.8+distFrac*1.2;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(0.18,ac.currentTime+0.15);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    p.pan.value=pan*0.2;
    o.connect(g);g.connect(p);p.connect(ac.destination);
    o.start();o.stop(ac.currentTime+dur+0.1);
  }catch(e){}
}

// ═══════════════════════════════════════════════════
// POINTER / PHYSICS
// ═══════════════════════════════════════════════════
const pointers={};
const FORCE_R=130, FORCE_STR=20, SPRING=0.055, DAMP=0.82, MAXV=30;
let lastTap=0;

function ptId(e){return e.pointerId!==undefined?e.pointerId:'mouse';}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const id=ptId(e);
  pointers[id]={x:e.clientX,y:e.clientY,moved:false};
  lastTap=performance.now();
},{passive:false});

main.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const id=ptId(e);
  pointers[id]={x:e.clientX,y:e.clientY,moved:false};
},{passive:false});

main.addEventListener('pointermove',e=>{
  e.preventDefault();
  const pt=pointers[ptId(e)];
  if(!pt)return;
  pt.moved=true;
  pt.x=e.clientX;pt.y=e.clientY;
},{passive:false});

main.addEventListener('pointerup',e=>{
  e.preventDefault();
  const id=ptId(e);
  const pt=pointers[id];
  if(pt&&!pt.moved){
    // TAP — cycle palette + spawn ripple + play drop
    fromP=PALETTES[palIdx];
    palIdx=(palIdx+1)%PALETTES.length;
    targetP=PALETTES[palIdx];
    lerpT=0;
    spawnRipple(pt.x,pt.y,targetP.a);
    playDrop(pt.x,pt.y,palIdx);
  }
  delete pointers[id];
},{passive:false});

main.addEventListener('pointercancel',e=>{delete pointers[ptId(e)];},{passive:true});

function applyPhysics(){
  const cx=main.width/2, cy=main.height/2;
  const pts=Object.values(pointers);
  parts.forEach(p=>{
    const wx=cx+p.ox, wy=cy+p.oy;
    p.vx+=(p.bx-p.ox)*SPRING;
    p.vy+=(p.by-p.oy)*SPRING;
    pts.forEach(pt=>{
      const dx=wx-pt.x, dy=wy-pt.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<FORCE_R&&d>0.5){
        const f=FORCE_STR*Math.pow(1-d/FORCE_R,2)/d;
        p.vx+=dx*f; p.vy+=dy*f;
      }
    });
    // Ripple forces — particles pushed outward by active ripples
    ripples.forEach(rip=>{
      const rdx=wx-rip.x, rdy=wy-rip.y;
      const rd=Math.sqrt(rdx*rdx+rdy*rdy);
      // Each Fibonacci ring passes through particles
      for(let n=0;n<7;n++){
        const rr=fibRingR(n,rip.age);
        const diff=Math.abs(rd-rr);
        if(diff<18){
          const push=(1-diff/18)*2.5*(1-rip.age/rip.maxAge);
          if(rd>0){p.vx+=rdx/rd*push; p.vy+=rdy/rd*push;}
        }
      }
    });
    p.vx*=DAMP; p.vy*=DAMP;
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    if(spd>MAXV){p.vx=p.vx/spd*MAXV;p.vy=p.vy/spd*MAXV;}
    p.ox+=p.vx; p.oy+=p.vy;
  });
}

// ═══════════════════════════════════════════════════
// DRAW RIPPLES — Fibonacci spiral sonar rings
// ═══════════════════════════════════════════════════
function drawRipples(dt){
  rctx.clearRect(0,0,ripple.width,ripple.height);

  for(let ri=ripples.length-1;ri>=0;ri--){
    const rip=ripples[ri];
    rip.age+=dt;
    if(rip.age>rip.maxAge){ripples.splice(ri,1);continue;}
    const life=1-rip.age/rip.maxAge;

    // Draw 8 Fibonacci rings — each at PHI^n × expanding radius
    for(let n=0;n<8;n++){
      const rr=fibRingR(n,rip.age);
      if(rr>Math.max(ripple.width,ripple.height)*1.4)break;

      // Ring alpha fades with life and with ring index
      const ringLife=Math.max(0,life-(n*0.08));
      if(ringLife<=0)continue;
      const alpha=ringLife*0.55*(1/(n*0.4+1));
      const lineW=Math.max(0.5,(2.5-n*0.25)*ringLife);

      // Draw the ring
      rctx.beginPath();
      rctx.arc(rip.x,rip.y,rr,0,PI*2);
      rctx.strokeStyle=rgb(rip.color,alpha);
      rctx.lineWidth=lineW;
      rctx.stroke();

      // Fibonacci spiral arms emanating from tap point
      // Number of arms = Fibonacci numbers: 1,1,2,3,5,8,13,21
      const fibArms=[1,2,3,5,8,13,21,34][n]||1;
      const armLen=rr*0.22;
      for(let arm=0;arm<fibArms;arm++){
        const angle=(arm/fibArms)*PI*2 + rip.age*(1+n*0.3)*0.8;
        const ax=rip.x+Math.cos(angle)*rr;
        const ay=rip.y+Math.sin(angle)*rr;
        // Spiral arm: arc outward from ring point
        rctx.beginPath();
        for(let s=0;s<=20;s++){
          const st=s/20;
          const ar=rr+st*armLen;
          const aa=angle+st*GA*0.5;
          const sx=rip.x+Math.cos(aa)*ar;
          const sy=rip.y+Math.sin(aa)*ar;
          s===0?rctx.moveTo(sx,sy):rctx.lineTo(sx,sy);
        }
        rctx.strokeStyle=rgb(rip.color,alpha*0.4);
        rctx.lineWidth=lineW*0.5;
        rctx.stroke();
      }

      // Small node dots at ring intersections (Fibonacci lattice points)
      for(let dot=0;dot<Math.min(fibArms,21);dot++){
        const angle=(dot/fibArms)*PI*2+rip.age*0.5;
        const dx=rip.x+Math.cos(angle)*rr;
        const dy=rip.y+Math.sin(angle)*rr;
        rctx.beginPath();rctx.arc(dx,dy,lineW*1.5,0,PI*2);
        rctx.fillStyle=rgb(rip.color,alpha*0.8);
        rctx.fill();
      }
    }

    // Centre impact glow — fades fast
    if(rip.age<0.3){
      const cAlpha=(1-rip.age/0.3)*0.7;
      const cg=rctx.createRadialGradient(rip.x,rip.y,0,rip.x,rip.y,40);
      cg.addColorStop(0,rgb(rip.color,cAlpha));
      cg.addColorStop(1,'transparent');
      rctx.fillStyle=cg;
      rctx.beginPath();rctx.arc(rip.x,rip.y,40,0,PI*2);rctx.fill();
    }
  }
}

// ═══════════════════════════════════════════════════
// MAIN DRAW
// ═══════════════════════════════════════════════════
let t=0, lastTime=performance.now();

function draw(now){
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;
  t+=0.008;

  updateLiveColors();
  applyPhysics();
  drawRipples(dt);

  const cx=main.width/2, cy=main.height/2;
  const pulse=Math.sin(t*3.5);
  const drift=t*0.2;
  const schW=(Math.sin(t*7.83)+1)/2;

  // Soft fade trail
  mctx.fillStyle=`rgba(${liveBg[0]},${liveBg[1]},${liveBg[2]},0.12)`;
  mctx.fillRect(0,0,main.width,main.height);

  // ── TUNNEL RINGS ──────────────────────────────
  for(let ring=1;ring<22;ring++){
    const rr=ring*44+Math.sin(t*2+ring)*11;
    const alpha=0.03+schW*0.025;
    mctx.beginPath();mctx.arc(cx,cy,rr,0,PI*2);
    mctx.strokeStyle=rgb(liveCore,alpha);
    mctx.lineWidth=1;mctx.stroke();
    mctx.save();mctx.translate(cx,cy);
    mctx.rotate(t*(7.83/ring)*0.06);
    mctx.fillStyle=rgb(liveCore,0.35);
    mctx.fillRect(rr,0,3,3);
    mctx.restore();
  }

  // ── FIBONACCI SPIRAL OVERLAY ──────────────────
  mctx.beginPath();
  mctx.strokeStyle=rgb(liveB,0.06);
  mctx.lineWidth=1;
  for(let j=0;j<500;j++){
    const theta=j*0.05+t*0.07;
    const rad=Math.pow(PHI,theta*0.32)*5;
    const sx=cx+Math.cos(theta*PI)*rad;
    const sy=cy+Math.sin(theta*PI)*rad;
    j===0?mctx.moveTo(sx,sy):mctx.lineTo(sx,sy);
  }
  mctx.stroke();

  // ── UPDATE BASE + DRAW PARTICLES ──────────────
  for(let i=0;i<N;i++){
    const p=parts[i];
    const b=spiralBase(i,drift+Math.sin(t*0.3+i*0.004)*0.4);
    p.bx=b.bx;p.by=b.by;
    const px=cx+p.ox, py=cy+p.oy;
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    const size=0.5+p.depth*2.4+Math.min(spd*0.16,4);
    const baseA=0.14+p.depth*0.6+Math.min(spd*0.04,0.35);

    let col;
    if(i%3===0)       col=rgb(liveA,baseA);
    else if(i%3===1)  col=rgb(liveB,baseA*0.7);
    else {
      const exc=Math.min(spd/MAXV,1);
      col=`rgba(255,255,255,${exc*0.5+baseA*0.3})`;
    }

    // Web lines between neighbours
    if(i%12===0&&i+12<N){
      const nb=parts[i+12];
      const s2=Math.sqrt(nb.vx*nb.vx+nb.vy*nb.vy);
      mctx.strokeStyle=rgb(liveA,0.012+Math.min((spd+s2)*0.004,0.05)+p.depth*0.02);
      mctx.lineWidth=0.6;
      mctx.beginPath();mctx.moveTo(px,py);
      mctx.lineTo(cx+nb.ox,cy+nb.oy);mctx.stroke();
    }
    if(i%24===0){
      mctx.strokeStyle=rgb(liveA,0.012+Math.min(spd*0.005,0.03)+p.depth*0.015);
      mctx.lineWidth=0.5;
      mctx.beginPath();mctx.moveTo(cx,cy);mctx.lineTo(px,py);mctx.stroke();
    }

    mctx.fillStyle=col;
    mctx.beginPath();mctx.arc(px,py,size,0,PI*2);mctx.fill();
  }

  // ── FINGER GLOW ───────────────────────────────
  Object.values(pointers).forEach(pt=>{
    const gr=mctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,FORCE_R);
    gr.addColorStop(0, rgb(liveA,0.22));
    gr.addColorStop(0.5,rgb(liveA,0.07));
    gr.addColorStop(1,'transparent');
    mctx.fillStyle=gr;
    mctx.beginPath();mctx.arc(pt.x,pt.y,FORCE_R,0,PI*2);mctx.fill();
    mctx.beginPath();mctx.arc(pt.x,pt.y,5,0,PI*2);
    mctx.fillStyle=rgb(liveA,0.95);mctx.fill();
  });

  // ── CENTRE CORE ───────────────────────────────
  const coreR=18+Math.sin(t*7.83)*4+Math.abs(pulse)*5+schW*4;
  const cg=mctx.createRadialGradient(cx,cy,0,cx,cy,coreR*2.8);
  cg.addColorStop(0,rgb(liveCore,0.95));
  cg.addColorStop(0.35,rgb(liveCore,0.4));
  cg.addColorStop(1,'transparent');
  mctx.fillStyle=cg;
  mctx.beginPath();mctx.arc(cx,cy,coreR*2.8,0,PI*2);mctx.fill();

  requestAnimationFrame(draw);
}

mctx.translate(0.5,0.5);
requestAnimationFrame(draw);
</script>
</body>
</html>
