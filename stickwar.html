<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stick War — Draw Your Shot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5f0e8;
    font-family: 'Patrick Hand', cursive;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Paper texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, #c8d0e0 27px, #c8d0e0 28px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  #ui {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    background: #fff9ef;
    border-bottom: 2px solid #3a3a3a;
    flex-wrap: wrap;
  }

  #title {
    font-family: 'Permanent Marker', cursive;
    font-size: 1.3rem;
    color: #1a1a2e;
    letter-spacing: 1px;
    margin-right: 6px;
  }

  .btn {
    font-family: 'Patrick Hand', cursive;
    font-size: 0.85rem;
    padding: 4px 10px;
    border: 2px solid #3a3a3a;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:hover { background: #e0f0ff; transform: translateY(-1px); }
  .btn.active { background: #3a3a3a; color: #fff; }
  .btn.red { border-color: #c0392b; color: #c0392b; }
  .btn.red:hover, .btn.red.active { background: #c0392b; color: #fff; }
  .btn.blue { border-color: #2980b9; color: #2980b9; }
  .btn.blue:hover, .btn.blue.active { background: #2980b9; color: #fff; }

  #status {
    font-family: 'Permanent Marker', cursive;
    font-size: 0.95rem;
    margin-left: auto;
    padding: 2px 10px;
    border-radius: 4px;
  }
  #status.red-turn { background: #fde8e8; color: #c0392b; border: 2px solid #c0392b; }
  #status.blue-turn { background: #e8f4fd; color: #2980b9; border: 2px solid #2980b9; }
  #status.gameover { background: #fef9e7; color: #7d6608; border: 2px solid #f1c40f; }

  #hp-panel {
    display: flex; gap: 14px; align-items: center; font-size: 0.8rem;
  }
  .hp-bar-wrap { display: flex; align-items: center; gap: 4px; }
  .hp-bar { width: 70px; height: 8px; background: #ddd; border: 1px solid #aaa; border-radius: 3px; overflow: hidden; }
  .hp-fill { height: 100%; transition: width 0.4s; }
  .hp-fill.red { background: #e74c3c; }
  .hp-fill.blue { background: #3498db; }

  #instructions {
    font-size: 0.75rem;
    color: #666;
    margin-left: 4px;
  }

  canvas {
    position: relative;
    z-index: 5;
    flex: 1;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  #msg-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
  }

  #msg-box {
    font-family: 'Permanent Marker', cursive;
    font-size: 2rem;
    color: #1a1a2e;
    background: rgba(255,249,239,0.95);
    border: 3px solid #3a3a3a;
    padding: 20px 40px;
    border-radius: 8px;
    text-align: center;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.3s, transform 0.3s;
  }
  #msg-box.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  #msg-box small { font-family: 'Patrick Hand', cursive; font-size: 1rem; display: block; margin-top: 6px; color: #555; }
</style>
</head>
<body>

<div id="ui">
  <span id="title">✏️ Stick War</span>

  <button class="btn" onclick="setTool('soldier')">🧍 Soldier</button>
  <button class="btn" onclick="setTool('gunner')">🔫 Gunner</button>
  <button class="btn" onclick="setTool('base')">🏠 Base</button>
  <button class="btn" onclick="setTool('plane')">✈️ Plane</button>
  <button class="btn" onclick="setTool('heli')">🚁 Heli</button>
  <button class="btn" onclick="setTool('tank')">🛡️ Tank</button>

  <span style="color:#aaa">|</span>

  <button class="btn" id="btn-shoot" onclick="setTool('shoot')">💥 Draw Shot</button>
  <button class="btn" onclick="endTurn()">⏭ End Turn</button>
  <button class="btn" onclick="resetGame()">🔄 New Game</button>

  <div id="hp-panel">
    <div class="hp-bar-wrap">
      <span style="color:#c0392b;font-size:0.8rem">RED</span>
      <div class="hp-bar"><div class="hp-fill red" id="hp-red"></div></div>
      <span id="hp-red-txt" style="font-size:0.75rem;color:#c0392b"></span>
    </div>
    <div class="hp-bar-wrap">
      <span style="color:#2980b9;font-size:0.8rem">BLU</span>
      <div class="hp-bar"><div class="hp-fill blue" id="hp-blue"></div></div>
      <span id="hp-blue-txt" style="font-size:0.75rem;color:#2980b9"></span>
    </div>
  </div>

  <span id="status" class="red-turn">RED's Turn</span>
  <span id="instructions">Place units then Draw Shot to fire</span>
</div>

<canvas id="c"></canvas>

<div id="msg-overlay">
  <div id="msg-box">
    <div id="msg-text"></div>
    <small>Click to continue</small>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── State ──────────────────────────────────────────────────────────────────
let tool = 'soldier';
let turn = 'red';   // 'red' | 'blue'
let shotsLeft = 1;
let gameOver = false;
let units = [];     // {team, type, x, y, hp, maxHp, dead}
let bullets = [];   // animated bullets
let explosions = [];
let drawingShot = false;
let shotStart = null;
let shotEnd = null;
let shotLine = null; // {x1,y1,x2,y2}

const GROUND_Y_FRAC = 0.82;
let W, H, GROUND_Y;

const TEAM_COLOR = { red: '#c0392b', blue: '#2980b9' };
const TEAM_HP    = { red: 300, blue: 300 };
let teamHp = { red: 300, blue: 300 };

const UNIT_PROPS = {
  soldier: { hp: 30,  maxHp: 30,  r: 14 },
  gunner:  { hp: 25,  maxHp: 25,  r: 14 },
  base:    { hp: 80,  maxHp: 80,  r: 26 },
  plane:   { hp: 40,  maxHp: 40,  r: 18 },
  heli:    { hp: 35,  maxHp: 35,  r: 18 },
  tank:    { hp: 60,  maxHp: 60,  r: 22 },
};

// ── Resize ─────────────────────────────────────────────────────────────────
function resize() {
  W = canvas.width  = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
  GROUND_Y = H * GROUND_Y_FRAC;
  draw();
}
window.addEventListener('resize', resize);

// ── Tool selection ─────────────────────────────────────────────────────────
function setTool(t) {
  tool = t;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  if (t === 'shoot') document.getElementById('btn-shoot').classList.add('active');
}

// ── Drawing helpers ────────────────────────────────────────────────────────
function drawGround() {
  // Ground fill
  ctx.fillStyle = '#8d7145';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // Ground line — thick hand-drawn look
  ctx.save();
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  // slight wobble
  for (let x = 0; x <= W; x += 40) {
    ctx.lineTo(x, GROUND_Y + Math.sin(x * 0.05) * 2);
  }
  ctx.stroke();
  ctx.restore();

  // Grass tufts
  ctx.strokeStyle = '#5d8a3c';
  ctx.lineWidth = 2;
  for (let x = 20; x < W; x += 18) {
    const bx = x + Math.sin(x) * 3;
    const by = GROUND_Y + Math.sin(x * 0.05) * 2;
    ctx.beginPath();
    ctx.moveTo(bx - 4, by);
    ctx.lineTo(bx,     by - 7 - Math.random() * 3);
    ctx.lineTo(bx + 4, by);
    ctx.stroke();
  }
}

function drawStickFigure(x, y, color, scale = 1) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = 2.2 * scale;
  ctx.lineCap     = 'round';
  const s = scale * 14;
  // head
  ctx.beginPath();
  ctx.arc(x, y - s * 2.1, s * 0.7, 0, Math.PI * 2);
  ctx.stroke();
  // body
  ctx.beginPath(); ctx.moveTo(x, y - s * 1.4); ctx.lineTo(x, y); ctx.stroke();
  // arms
  ctx.beginPath(); ctx.moveTo(x - s * 0.9, y - s * 1.0); ctx.lineTo(x + s * 0.9, y - s * 1.0); ctx.stroke();
  // legs
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s * 0.7, y + s * 1.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s * 0.7, y + s * 1.0); ctx.stroke();
  ctx.restore();
}

function drawGunner(x, y, color) {
  drawStickFigure(x, y, color);
  // gun barrel
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y - 10);
  ctx.lineTo(x + 22, y - 14);
  ctx.stroke();
  ctx.restore();
}

function drawBase(x, y, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color + '33';
  ctx.lineWidth = 3;
  // house shape
  ctx.beginPath();
  ctx.moveTo(x - 22, y);
  ctx.lineTo(x - 22, y - 22);
  ctx.lineTo(x,       y - 34);
  ctx.lineTo(x + 22,  y - 22);
  ctx.lineTo(x + 22,  y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // door
  ctx.fillStyle = color;
  ctx.fillRect(x - 7, y - 14, 14, 14);
  ctx.restore();
}

function drawPlane(x, y, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color + '44';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  // fuselage
  ctx.ellipse(x, y, 22, 8, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // wings
  ctx.beginPath();
  ctx.moveTo(x - 8, y); ctx.lineTo(x - 8, y - 18); ctx.lineTo(x + 10, y); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // tail
  ctx.beginPath();
  ctx.moveTo(x + 18, y); ctx.lineTo(x + 18, y - 10); ctx.lineTo(x + 8, y); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawHeli(x, y, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color + '44';
  ctx.lineWidth = 2.5;
  // body
  ctx.beginPath();
  ctx.ellipse(x, y + 4, 16, 9, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // rotor
  ctx.beginPath();
  ctx.moveTo(x - 22, y - 4); ctx.lineTo(x + 22, y - 4);
  ctx.lineWidth = 3;
  ctx.stroke();
  // tail
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 14, y + 4); ctx.lineTo(x + 28, y - 4); ctx.lineTo(x + 28, y + 2);
  ctx.stroke();
  ctx.restore();
}

function drawTank(x, y, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color + '44';
  ctx.lineWidth = 2.5;
  // body
  ctx.fillRect(x - 20, y - 10, 40, 18);
  ctx.strokeRect(x - 20, y - 10, 40, 18);
  // turret
  ctx.beginPath();
  ctx.ellipse(x - 4, y - 14, 12, 8, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // barrel
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(x + 2, y - 14); ctx.lineTo(x + 28, y - 18);
  ctx.stroke();
  // wheels
  ctx.lineWidth = 2;
  for (let wx of [-14, -4, 6, 16]) {
    ctx.beginPath();
    ctx.arc(x + wx, y + 8, 5, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawUnit(u) {
  if (u.dead) return;
  const col = TEAM_COLOR[u.team];
  const gfx = {
    soldier: () => drawStickFigure(u.x, u.y, col),
    gunner:  () => drawGunner(u.x, u.y, col),
    base:    () => drawBase(u.x, u.y, col),
    plane:   () => drawPlane(u.x, u.y, col),
    heli:    () => drawHeli(u.x, u.y, col),
    tank:    () => drawTank(u.x, u.y, col),
  };
  (gfx[u.type] || gfx.soldier)();

  // HP bar
  if (u.hp < u.maxHp) {
    const bw = 36, bh = 4;
    const bx = u.x - bw / 2, by = u.y - 44;
    ctx.fillStyle = '#ddd';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = col;
    ctx.fillRect(bx, by, bw * (u.hp / u.maxHp), bh);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
  }
}

function drawShotLine() {
  if (!shotLine) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(50,50,50,0.5)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(shotLine.x1, shotLine.y1);
  ctx.lineTo(shotLine.x2, shotLine.y2);
  ctx.stroke();
  // arrowhead
  const dx = shotLine.x2 - shotLine.x1, dy = shotLine.y2 - shotLine.y1;
  const len = Math.sqrt(dx*dx+dy*dy);
  if (len > 0) {
    const ux = dx/len, uy = dy/len;
    const ax = shotLine.x2, ay = shotLine.y2;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - ux*10 + uy*6, ay - uy*10 - ux*6);
    ctx.lineTo(ax - ux*10 - uy*6, ay - uy*10 + ux*6);
    ctx.closePath();
    ctx.fillStyle = '#333';
    ctx.fill();
  }
  ctx.restore();
}

// Explosions
function spawnExplosion(x, y, color) {
  explosions.push({ x, y, color, r: 4, maxR: 28, life: 1.0 });
}

function updateExplosions() {
  for (const e of explosions) {
    e.r += 1.8;
    e.life -= 0.045;
  }
  explosions = explosions.filter(e => e.life > 0);
}

function drawExplosions() {
  for (const e of explosions) {
    ctx.save();
    ctx.globalAlpha = e.life;
    const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    grad.addColorStop(0, '#fff7aa');
    grad.addColorStop(0.4, '#f39c12');
    grad.addColorStop(1, e.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Animated bullet
function spawnBullet(x1,y1,x2,y2, team) {
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  if (len===0) return null;
  return { x:x1, y:y1, tx:x2, ty:y2, vx:dx/len*9, vy:dy/len*9, team, done:false };
}

function updateBullets() {
  for (const b of bullets) {
    if (b.done) continue;
    b.x += b.vx; b.y += b.vy;
    const dx = b.tx-b.x, dy = b.ty-b.y;
    if (dx*dx+dy*dy < 100) {
      b.done = true;
      resolveShot(b.x, b.y, b.team);
      spawnExplosion(b.x, b.y, TEAM_COLOR[b.team]);
    }
  }
  bullets = bullets.filter(b => !b.done);
}

function drawBullets() {
  for (const b of bullets) {
    ctx.save();
    ctx.fillStyle = TEAM_COLOR[b.team];
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
    ctx.fill();
    // trail
    ctx.strokeStyle = TEAM_COLOR[b.team] + '66';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx*4, b.y - b.vy*4);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.restore();
  }
}

// ── Main draw ──────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#c9e8f7');
  sky.addColorStop(1, '#e8f4fb');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // Clouds
  drawClouds();

  drawGround();

  // Team divider — faint center line
  ctx.save();
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 1;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, GROUND_Y);
  ctx.stroke();
  ctx.restore();

  // Team labels
  ctx.save();
  ctx.font = "bold 12px 'Patrick Hand', cursive";
  ctx.fillStyle = '#c0392b44';
  ctx.fillText('RED SIDE', 10, 20);
  ctx.fillStyle = '#2980b944';
  ctx.textAlign = 'right';
  ctx.fillText('BLUE SIDE', W - 10, 20);
  ctx.restore();

  units.forEach(drawUnit);
  drawShotLine();
  drawExplosions();
  drawBullets();

  // Draw mode indicator
  if (tool === 'shoot' && !gameOver) {
    ctx.save();
    ctx.font = "13px 'Patrick Hand', cursive";
    ctx.fillStyle = '#c0392b';
    ctx.fillText(`💥 Draw your shot line! (${shotsLeft} shot left)`, 10, H - 10);
    ctx.restore();
  }
}

const clouds = Array.from({length:5}, (_, i) => ({
  x: (i+0.5) * W/5 || 100,
  y: 30 + Math.random()*40,
  r: 18 + Math.random()*18
}));
function drawClouds() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.arc(c.x+c.r*0.8, c.y-c.r*0.3, c.r*0.7, 0, Math.PI*2);
    ctx.arc(c.x-c.r*0.8, c.y-c.r*0.2, c.r*0.6, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// ── Game loop ──────────────────────────────────────────────────────────────
function loop() {
  updateBullets();
  updateExplosions();
  draw();
  requestAnimationFrame(loop);
}

// ── Unit placement ─────────────────────────────────────────────────────────
function snapToGround(type, y) {
  // Aerial units float
  if (type === 'plane' || type === 'heli') return y;
  return GROUND_Y;
}

function placeUnit(x, y) {
  if (gameOver) return;
  if (tool === 'shoot') return;

  // Team boundary: red left half, blue right half
  if (turn === 'red' && x > W / 2) { flashMsg("Red must place on the LEFT side!"); return; }
  if (turn === 'blue' && x < W / 2) { flashMsg("Blue must place on the RIGHT side!"); return; }

  const props = UNIT_PROPS[tool];
  if (!props) return;
  const gy = snapToGround(tool, y);
  units.push({
    team: turn,
    type: tool,
    x, y: gy,
    hp: props.hp,
    maxHp: props.maxHp,
    dead: false,
  });
  draw();
}

// ── Shooting ───────────────────────────────────────────────────────────────
function fireShot(x1, y1, x2, y2) {
  if (shotsLeft <= 0) { flashMsg("No shots left! End your turn."); return; }
  // Find closest enemy along line within hitRadius
  const b = spawnBullet(x1, y1, x2, y2, turn);
  if (b) {
    bullets.push(b);
    shotLine = null;
    shotsLeft--;
    updateStatusBar();
  }
}

function resolveShot(bx, by, team) {
  const enemy = turn === 'red' ? 'blue' : 'red';
  let hit = false;
  for (const u of units) {
    if (u.dead || u.team !== enemy) continue;
    const props = UNIT_PROPS[u.type];
    const r = props ? props.r : 14;
    const dx = bx - u.x, dy = by - u.y;
    if (dx*dx + dy*dy < (r + 8) * (r + 8)) {
      const dmg = 10 + Math.floor(Math.random() * 12);
      u.hp = Math.max(0, u.hp - dmg);
      teamHp[enemy] = Math.max(0, teamHp[enemy] - dmg);
      hit = true;
      if (u.hp <= 0) {
        u.dead = true;
        spawnExplosion(u.x, u.y, TEAM_COLOR[u.team]);
      }
    }
  }
  updateHpBars();
  checkWin();
}

function checkWin() {
  if (teamHp.red <= 0) {
    endGame('BLUE WINS! 🎉');
  } else if (teamHp.blue <= 0) {
    endGame('RED WINS! 🎉');
  }
}

function endGame(msg) {
  gameOver = true;
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'gameover';
  showMsg(msg, true);
}

// ── Turn management ────────────────────────────────────────────────────────
function endTurn() {
  if (gameOver) return;
  turn = turn === 'red' ? 'blue' : 'red';
  shotsLeft = 1;
  shotLine = null;
  updateStatusBar();
  flashMsg(turn.toUpperCase() + "'s Turn!", 800);
}

function updateStatusBar() {
  const el = document.getElementById('status');
  el.textContent = turn.toUpperCase() + "'s Turn" + (tool === 'shoot' ? ` — ${shotsLeft} shot` : '');
  el.className = turn + '-turn';
}

function updateHpBars() {
  const maxHp = 300;
  document.getElementById('hp-red').style.width = (teamHp.red / maxHp * 100) + '%';
  document.getElementById('hp-blue').style.width = (teamHp.blue / maxHp * 100) + '%';
  document.getElementById('hp-red-txt').textContent = teamHp.red;
  document.getElementById('hp-blue-txt').textContent = teamHp.blue;
}

// ── Messages ───────────────────────────────────────────────────────────────
let msgTimer = null;
function flashMsg(txt, dur = 1400) {
  const box = document.getElementById('msg-box');
  document.getElementById('msg-text').textContent = txt;
  document.querySelector('#msg-box small').style.display = 'none';
  box.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { box.classList.remove('show'); }, dur);
}
function showMsg(txt) {
  const box = document.getElementById('msg-box');
  document.getElementById('msg-text').textContent = txt;
  document.querySelector('#msg-box small').style.display = '';
  box.classList.add('show');
}
document.getElementById('msg-overlay').addEventListener('click', () => {
  const box = document.getElementById('msg-box');
  if (gameOver) { resetGame(); return; }
  box.classList.remove('show');
});

// ── Reset ──────────────────────────────────────────────────────────────────
function resetGame() {
  units = [];
  bullets = [];
  explosions = [];
  turn = 'red';
  shotsLeft = 1;
  gameOver = false;
  shotLine = null;
  teamHp = { red: 300, blue: 300 };
  tool = 'soldier';
  document.getElementById('msg-box').classList.remove('show');
  updateStatusBar();
  updateHpBars();
}

// ── Input ──────────────────────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  if (e.touches) {
    return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  }
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('mousedown', e => {
  if (gameOver) return;
  const p = getPos(e);
  if (tool === 'shoot') {
    drawingShot = true;
    shotStart = p;
    shotLine = null;
  } else {
    placeUnit(p.x, p.y);
  }
});

canvas.addEventListener('mousemove', e => {
  if (!drawingShot || tool !== 'shoot') return;
  const p = getPos(e);
  shotLine = { x1: shotStart.x, y1: shotStart.y, x2: p.x, y2: p.y };
});

canvas.addEventListener('mouseup', e => {
  if (!drawingShot) return;
  drawingShot = false;
  if (!shotLine) return;
  fireShot(shotLine.x1, shotLine.y1, shotLine.x2, shotLine.y2);
  shotLine = null;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameOver) return;
  const p = getPos(e);
  if (tool === 'shoot') {
    drawingShot = true;
    shotStart = p;
  } else {
    placeUnit(p.x, p.y);
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!drawingShot) return;
  const p = getPos(e);
  shotLine = { x1: shotStart.x, y1: shotStart.y, x2: p.x, y2: p.y };
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!drawingShot) return;
  drawingShot = false;
  if (!shotLine) return;
  fireShot(shotLine.x1, shotLine.y1, shotLine.x2, shotLine.y2);
  shotLine = null;
});

// ── Init ───────────────────────────────────────────────────────────────────
resize();
updateHpBars();
updateStatusBar();
loop();

// Welcome
setTimeout(() => {
  showMsg("Stick War!\nPlace units, then Draw Shot!");
  document.querySelector('#msg-box small').textContent = 'Click to start — Red goes first';
}, 400);
</script>
