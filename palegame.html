<style>
/* ============================================================
   PALE ARCHIVE — ANSI BBS door game
   16-color CGA/ANSI palette. Phosphor CRT treatment.
   All animation timing quantized to 7.83 Hz (127.7ms cycles)
   — the tower's synthetic Schumann pulse. Diegetic.
   ============================================================ */
:root{
  --blk:#000000; --blu:#0000AA; --grn:#00AA00; --cyn:#00AAAA;
  --red:#AA0000; --mag:#AA00AA; --brn:#AA5500; --lgy:#AAAAAA;
  --dgy:#555555; --lbl:#5555FF; --lgr:#55FF55; --lcy:#55FFFF;
  --lrd:#FF5555; --lmg:#FF55FF; --yel:#FFFF55; --wht:#FFFFFF;
  --schumann: 0.1277s; /* 1/7.83 Hz */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050505;overflow:hidden}
body{
  font-family:"IBM Plex Mono","Cascadia Mono","Consolas","Menlo","Courier New",monospace;
  color:var(--lgy);
  display:flex;justify-content:center;align-items:stretch;
}
#crt{
  position:relative;width:100%;max-width:860px;height:100%;
  background:#000;display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(0,60,0,.25) inset;
}
/* scanlines + faint phosphor glow */
#crt::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
#crt::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%);
}
#screen{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:6px 10px 90px 10px;
  font-size:clamp(10.5px, 2.6vw, 15px);
  line-height:1.32;
  text-shadow:0 0 3px currentColor;
  scrollbar-width:thin;scrollbar-color:#0a0 #000;
}
#screen::-webkit-scrollbar{width:6px}
#screen::-webkit-scrollbar-thumb{background:#063}
pre{font-family:inherit;white-space:pre;overflow-x:auto;line-height:1.15}
/* colors */
.k{color:var(--blk)}.b{color:var(--blu)}.g{color:var(--grn)}.c{color:var(--cyn)}
.r{color:var(--red)}.m{color:var(--mag)}.n{color:var(--brn)}.w{color:var(--lgy)}
.K{color:var(--dgy)}.B{color:var(--lbl)}.G{color:var(--lgr)}.C{color:var(--lcy)}
.R{color:var(--lrd)}.M{color:var(--lmg)}.Y{color:var(--yel)}.W{color:var(--wht)}
.bgb{background:var(--blu);color:var(--wht);text-shadow:none}
.bgr{background:var(--red);color:var(--wht);text-shadow:none}
.bgg{background:var(--grn);color:var(--blk);text-shadow:none}
.bgc{background:var(--cyn);color:var(--blk);text-shadow:none}
.inv{background:var(--lgy);color:var(--blk);text-shadow:none}
/* status bar */
#statbar{
  position:sticky;top:0;z-index:40;
  background:var(--blu);color:var(--wht);text-shadow:none;
  font-size:clamp(9.5px,2.4vw,13px);
  padding:2px 6px;white-space:nowrap;overflow-x:auto;
  border-bottom:1px solid #003;
  display:flex;gap:10px;
}
#statbar span{flex:0 0 auto}
#statbar .hot{color:var(--yel)}
#statbar .warn{color:var(--lrd)}
/* the tower light — pulses every 6 seconds, like the ridge at Harlow Flats */
#towerlight{
  display:inline-block;width:.7em;height:.7em;border-radius:50%;
  background:var(--red);vertical-align:middle;
  animation:tower 6s steps(1) infinite;
}
@keyframes tower{0%,88%{opacity:.15;box-shadow:none}
  88.1%,100%{opacity:1;box-shadow:0 0 8px var(--lrd),0 0 16px var(--red)}}
/* blinking cursor & pulse text — 4x Schumann cycle = 510.8ms */
.blink{animation:blk calc(var(--schumann)*8) steps(2,start) infinite}
@keyframes blk{to{visibility:hidden}}
.pulse{animation:pul calc(var(--schumann)*16) ease-in-out infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.35}}
/* panels drawn like ANSI boxes */
.box{
  border:1px solid var(--dgy);margin:6px 0;position:relative;
  padding:6px 8px;
}
.box.cy{border-color:var(--cyn)}.box.gr{border-color:var(--grn)}
.box.rd{border-color:var(--red)}.box.ye{border-color:var(--brn)}
.box .tab{
  position:absolute;top:-0.72em;left:8px;background:#000;padding:0 6px;
  font-weight:bold;letter-spacing:1px;
}
/* tappable menu rows (mobile-first) */
.mi{
  display:block;width:100%;padding:5px 8px;margin:2px 0;
  background:transparent;border:none;text-align:left;cursor:pointer;
  font:inherit;color:var(--lgy);text-shadow:inherit;
  border-left:2px solid transparent;
}
.mi:hover,.mi:focus{background:rgba(0,80,160,.35);border-left-color:var(--lcy);outline:none}
.mi .key{color:var(--yel);font-weight:bold}
.mi .lab{color:var(--lcy)}
.mi .sub{color:var(--dgy)}
.mi:disabled{opacity:.38;cursor:default}
.mi.danger .lab{color:var(--lrd)}
.mi.good .lab{color:var(--lgr)}
/* narrative text */
.story{color:var(--lgy);margin:4px 0;white-space:pre-wrap}
.story em{color:var(--lcy);font-style:normal}
.hr{color:var(--dgy);overflow:hidden;white-space:nowrap}
/* input line */
#inbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:860px;margin:0 auto;
  background:#000;border-top:1px solid var(--dgy);
  display:flex;align-items:center;padding:6px 8px;gap:6px;
  font-size:clamp(11px,2.7vw,15px);
}
#prompt{color:var(--lgr);text-shadow:0 0 3px currentColor;white-space:nowrap}
#cmd{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--wht);font:inherit;text-shadow:0 0 3px currentColor;
  caret-color:var(--lgr);min-width:40px;
}
#sndbtn{background:none;border:1px solid var(--dgy);color:var(--dgy);
  font:inherit;font-size:.8em;padding:2px 7px;cursor:pointer}
#sndbtn.on{color:var(--lgr);border-color:var(--grn)}
.tag{display:inline-block;padding:0 6px;margin-right:4px;font-weight:bold;text-shadow:none}
.c1{background:var(--grn);color:#000}.c2{background:var(--brn);color:#000}
.c3{background:var(--mag);color:#fff}.c4{background:var(--red);color:#fff}
.cu{background:var(--dgy);color:#fff}
.gauge{display:inline-block;letter-spacing:0}
.small{font-size:.85em}
.center{text-align:center}
@media (max-width:520px){ pre.wide{font-size:2.05vw} }
</style>

<body>
<div id="crt">
  <div id="statbar"></div>
  <div id="screen" aria-live="polite"></div>
</div>
<div id="inbar">
  <span id="prompt">&gt;</span>
  <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="key or command…" aria-label="command input">
  <button id="sndbtn" title="toggle terminal beeps">SND</button>
</div>
<script>
"use strict";
/* ================================================================
   PALE ARCHIVE — engine
   ================================================================ */
const $screen = document.getElementById('screen');
const $stat   = document.getElementById('statbar');
const $cmd    = document.getElementById('cmd');
const $snd    = document.getElementById('sndbtn');

/* ---------- audio: tiny square-wave beeps, off by default ---------- */
let AC=null, sndOn=false;
function beep(f=880,d=0.045,v=0.04){
  if(!sndOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.value=f; g.gain.value=v;
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}
$snd.onclick=()=>{sndOn=!sndOn;$snd.classList.toggle('on',sndOn);if(sndOn)beep(660,.06);};

/* ---------- render helpers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* mini-markup: `text` cyan-em, ^X...^  color codes */
function mk(s){
  return esc(s)
    .replace(/\^([kbgcrmnwKBGCRMNYW])\{([^}]*)\}/g,(m,c,t)=>`<span class="${c}">${t}</span>`)
    .replace(/\*\*([^*]+)\*\*/g,'<span class="W">$1</span>')
    .replace(/`([^`]+)`/g,'<span class="C">$1</span>');
}
let OUT=[];
function clear(){OUT=[];}
function line(html){OUT.push(`<div class="story">${html}</div>`);}
function txt(s){line(mk(s));}
function raw(html){OUT.push(html);}
function hr(ch='─'){OUT.push(`<div class="hr">${ch.repeat(200)}</div>`);}
function boxOpen(title,cls=''){OUT.push(`<div class="box ${cls}"><div class="tab ${cls==='rd'?'R':cls==='gr'?'G':cls==='ye'?'Y':'C'}">${esc(title)}</div>`);}
function boxClose(){OUT.push(`</div>`);}
function menu(items){
  /* items: [key,label,sub,handler,opts] */
  for(const it of items){
    const [key,label,sub,fn,opts={}]=it;
    const dis = opts.disabled?'disabled':'';
    const cls = opts.cls||'';
    const id  = 'mi_'+Math.random().toString(36).slice(2);
    OUT.push(`<button class="mi ${cls}" ${dis} data-key="${esc(key)}" id="${id}">`+
      `<span class="key">[${esc(key)}]</span> <span class="lab">${esc(label)}</span>`+
      (sub?` <span class="sub">— ${esc(sub)}</span>`:'')+`</button>`);
    pendingHandlers.push([id,fn,!!opts.disabled]);
  }
}
let pendingHandlers=[];
let keyMap={};
function flush(scrollTop=true){
  $screen.innerHTML=OUT.join('');
  keyMap={};
  for(const [id,fn,dis] of pendingHandlers){
    const el=document.getElementById(id);
    if(el&&!dis){ el.onclick=()=>{beep(740);fn();}; keyMap[el.dataset.key.toUpperCase()]=fn; }
  }
  pendingHandlers=[];
  if(scrollTop)$screen.scrollTop=0;
}
function gauge(v,max,n=10,onCls,offCh='░',onCh='█'){
  const f=Math.round(Math.max(0,Math.min(1,v/max))*n);
  return `<span class="gauge"><span class="${onCls}">${onCh.repeat(f)}</span><span class="K">${offCh.repeat(n-f)}</span></span>`;
}

/* ---------- persistent storage ---------- */
const SAVEKEY='palearchive:save1';
async function saveGame(silent=false){
  try{
    const r=await window.storage.set(SAVEKEY,JSON.stringify(G));
    if(!silent) toastMsg(r? '^G{ CARRIER HELD — game saved to node. }':'^R{ SAVE FAILED. }');
    return !!r;
  }catch(e){ if(!silent) toastMsg('^R{ SAVE FAILED — storage unavailable. }'); return false; }
}
async function loadGame(){
  try{
    const r=await window.storage.get(SAVEKEY);
    if(r&&r.value){ G=JSON.parse(r.value); return true; }
  }catch(e){}
  return false;
}
async function wipeSave(){ try{ await window.storage.delete(SAVEKEY);}catch(e){} }
let toast=null;
function toastMsg(s){ toast=s; }

/* ---------- game state ---------- */
function freshState(){
  return {
    ver:1, day:1, ap:4, apMax:4,
    power:100, cash:220, cred:10, heat:0,
    act:0,                 /* 0 boot-story, 1,2,3, 4=post-ending */
    loc:'KINGMAN',
    skill:0,               /* raised by Curriculum — reveals bonus evidence */
    flags:{},              /* story flags */
    cases:{},              /* id -> {opened,revealed:[],classified,correct,tries} */
    curr:{},               /* curriculum results id->{done,correct} */
    npcMet:{}, boardsRead:{}, upgrades:{},
    log:[], ending:null,
    stats:{classified:0,correct:0,cat4found:0}
  };
}
let G=freshState();
function flag(f){return !!G.flags[f];}
function setFlag(f){G.flags[f]=true;}
function addLog(s){G.log.unshift(`D${G.day}: ${s}`); if(G.log.length>40)G.log.length=40;}
function spendAP(n=1){ if(G.ap<n) return false; G.ap-=n; return true; }
function adj(o){ /* {cred,heat,cash,power} clamped */
  if(o.cred){G.cred=Math.max(0,Math.min(100,G.cred+o.cred));}
  if(o.heat){G.heat=Math.max(0,Math.min(100,G.heat+o.heat));}
  if(o.cash){G.cash=Math.max(0,G.cash+o.cash);}
  if(o.power){G.power=Math.max(0,Math.min(100,G.power+o.power));}
}

/* ---------- status bar ---------- */
function statbar(){
  const L=LOCS[G.loc]||{name:G.loc};
  const heatCls=G.heat>=70?'warn':(G.heat>=40?'hot':'');
  $stat.innerHTML=
    `<span><span id="towerlight"></span> PALE ARCHIVE</span>`+
    `<span>DAY <span class="hot">${G.day}</span></span>`+
    `<span>AP <span class="hot">${G.ap}/${G.apMax}</span></span>`+
    `<span>PWR ${gauge(G.power,100,6,'G')}</span>`+
    `<span>HEAT <span class="${heatCls}">${gauge(G.heat,100,6,G.heat>=70?'R':'Y')}</span></span>`+
    `<span>CRED ${G.cred}</span>`+
    `<span>$${G.cash}</span>`+
    `<span>${esc(L.name)}</span>`+
    (G.act?`<span>ACT ${'I'.repeat(Math.min(G.act,3))}</span>`:'');
}
</script>

const ACTIONS=[
 ['1','retell','STRIP THE RETELLING','witness statements closest to the event'],
 ['2','registry','REGISTRY CHECK','natural phenomena & the public catalog (Cat 1 screen)'],
 ['3','inventory','CLASSIFIED INVENTORY','Voss\'s program lists (Cat 2 screen)'],

let curCase=null;
function openCase(id){ curCase=id; const st=caseState(id); st.opened=true; go(scrCase); }
function scrCase(){
  SCREEN='case';
  const c=STORY[curCase], st=caseState(curCase);
  boxOpen(c.title,'cy'); txt(c.brief); boxClose();
  /* skill perk: auto-reveal retelling at skill>=1, registry at >=2 */
  if(G.skill>=1 && c.ev.retell && !st.revealed.includes('retell')){st.revealed.push('retell');}
  if(G.skill>=2 && c.ev.registry && !st.revealed.includes('registry')){st.revealed.push('registry');}
  if(st.revealed.length){
    boxOpen('EVIDENCE ON FILE','gr');
    for(const k of st.revealed){ const a=ACTIONS.find(x=>x[1]===k); txt(`^Y{▸ ${a?a[2]:k}} — ${c.ev[k]}`); }
    boxClose();
  }
  const mi=[];
  for(const [key,k,name,sub] of ACTIONS){
    if(!c.ev[k]) continue;
    if(st.revealed.includes(k)) continue;
    mi.push([key,name,sub+` · ${c.ap} AP`,()=>{
      if(!spendAP(c.ap)){toastMsg('^R{ Out of hours. REST to start a new day. }');return go(scrCase);}
      st.revealed.push(k);
      if(k==='field') adj({heat:+8});
      if(k==='scan') adj({power:-12});
      addLog(`${c.title}: ${name.toLowerCase()}.`);
      beep(520,.05);
      go(scrCase);
    }]);
  }
  mi.push(['K','CLASSIFY THE CASE',st.revealed.length<2?'gather at least 2 lines of evidence first':'apply the taxonomy',()=>go(scrClassify),{disabled:st.revealed.length<2,cls:'good'}]);
  mi.push(['B','BACK',null,()=>go(scrCaseList)]);

function scrClassify(){
  SCREEN='classify';

  boxOpen('CLASSIFICATION — '+c.title,'ye');
  txt('Apply the categories **in order**. Weight physical over testimonial. Ask who benefits. Then commit.');
  boxClose();
  const mi=[];
  for(const n of [1,2,3,4,5]){
    mi.push([n===5?'U':String(n),CATS[n].name,CATS[n].desc,()=>resolveCase(n)]);
  }

function resolveCase(n){
  const c=STORY[curCase], st=caseState(curCase);
  st.tries++; st.classified=n;
  clear();
  if(n===c.truth){
    st.correct=true; G.stats.classified++; G.stats.correct++;
    const evBonus=st.revealed.length;
    const credGain= (st.tries===1? 10:5) + Math.min(4,evBonus);
    adj({cred:+credGain});
    raw(`<div class="story"><span class="tag ${CATS[c.truth].tag}">${CATS[c.truth].name}</span> <span class="G">CORRECT.</span> <span class="K">(+${credGain} CRED)</span></div>`);
    boxOpen('VERDICT','gr'); txt(c.verdict); boxClose();
    addLog(`${c.title} closed correctly (Cat ${c.truth===5?'U':c.truth}).`);
    if(c.onCorrect)c.onCorrect();
    storyProgress();
  } else {
    G.stats.classified++;
    adj({cred:-6,heat:+5});
    raw(`<div class="story"><span class="R">MISFILED.</span> <span class="K">(−6 CRED, +5 HEAT — a wrong stamp echoes)</span></div>`);
    boxOpen('THE CHECKLIST PUSHES BACK','rd'); txt(c.wrongHint); boxClose();
    addLog(`${c.title}: misclassified. Retrying.`);
  }
  menu([['ENTER','CONTINUE',null,()=>go(st.correct?scrMain:scrCase)]]);
  flush(); statbar(); beep(n===c.truth?880:180,.12);
}

  boxOpen(`DAY ${G.day}`,'cy');
  txt('^K{Four-hour sleep intervals. Coffee. The waterfall display, first thing, like checking a pulse.}');
  boxClose();
  if(ev){
    const e=ev.run();
    boxOpen(e.title,'ye'); txt(e.body); boxClose();
    menu(e.opts.map(([k,l,f])=>[k,l,null,()=>{clear();f();menu([['ENTER','CONTINUE',null,()=>go(scrMain)]]);flush();statbar();saveGame(true);}]));
  } else {
    txt('^K{A quiet morning. Out here, quiet is either safety or the thing right before it isn\'t.}');
    menu([['ENTER','CONTINUE',null,()=>go(scrMain)]]);
  }
  flush(); statbar(); saveGame(true);
}

/* ---------- INPUT ---------- */
$cmd.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=$cmd.value.trim().toUpperCase(); $cmd.value='';
    const k=v||'ENTER';
    if(keyMap[k]){beep(740);keyMap[k]();}
    else if(keyMap['ENTER']&&v===''){beep(740);keyMap['ENTER']();}
    else beep(160,.08);
  }
});
document.addEventListener('keydown',e=>{
  if(e.target===$cmd) return;
  const k=e.key.length===1?e.key.toUpperCase():(e.key==='Enter'?'ENTER':null);
  if(k&&keyMap[k]){e.preventDefault();beep(740);keyMap[k]();}
});

/* ---------- INIT ---------- */
go(scrBoot);
</script>
</body>
